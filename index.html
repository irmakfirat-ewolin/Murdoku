<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Murdoku">
<meta name="theme-color" content="#120b22">
<title>Murdoku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Baloo+2:wght@400;500;600;700;800&family=Bungee&family=Kalam:wght@400;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#120b22;--bg2:#1b1233;--panel:#1d1538;--panel2:#271d4a;--line:#3d2f72;--ink:#f4efff;--soft:#a99bd6;
 --lav:#b69cff;--pink:#ff2d6f;--yel:#ffe14d;--cyan:#4dd2ff;--green:#3ef07a;--orange:#ffa31a;--wall:#14101e;--case:#b69cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;margin:0;color:var(--ink);font-family:"Baloo 2",system-ui,sans-serif;
 background:radial-gradient(120% 60% at 50% 0%,#2a1856 0%,var(--bg) 60%) fixed,var(--bg);min-height:100%}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.hidden{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 40px}

/* Kopf */
.top{display:flex;align-items:center;gap:10px;padding:12px 14px 6px;max-width:560px;margin:0 auto}
.top .back{font-size:24px;width:44px;height:44px;border-radius:14px;background:var(--panel2);border:1.5px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.brand{flex:1;font-weight:700;font-size:24px;color:var(--lav);text-shadow:0 0 14px #b69cff99}
.langs{display:flex;background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:3px}
.langs button{padding:5px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--soft)}
.langs button.on{background:var(--lav);color:#1a1033;box-shadow:0 0 12px #b69cffaa}

/* Titel */
.logo{text-align:center;margin:18px 0 6px}
.logo h1{margin:0;font-family:"Bungee",Impact,sans-serif;font-weight:400;font-size:clamp(46px,14vw,72px);letter-spacing:2px;line-height:1;color:#fff;position:relative;display:inline-block;
 text-shadow:0 0 6px #fff,0 0 18px #ff4fd8,0 0 38px #b69cff,0 0 60px #7a3cff}
.logo h1 .d{position:relative}
.logo h1 .d::after{content:"";position:absolute;left:46%;top:2px;width:7px;height:26px;background:#e3122f;border-radius:0 0 6px 6px;box-shadow:0 0 10px #ff1f3d}
.logo h1 .d.k::after{left:58%;height:18px}
.pillT{display:inline-block;margin-top:12px;background:#fff;color:#1a1033;border-radius:999px;padding:7px 18px;font-weight:600;font-size:clamp(13px,3.6vw,16px);box-shadow:0 0 18px #ff4fd855}
.pillT b{color:#e3122f}
.player{display:flex;gap:8px;align-items:center;margin:16px 0 4px;font-size:14px;color:var(--soft);background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:10px 12px}
.player input{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;font:inherit;background:var(--bg);color:var(--ink)}
.sync{font-size:12px;color:var(--soft)}
.book{margin:22px 0 10px;font-size:22px;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--lav);text-shadow:0 0 12px #b69cff88;flex-wrap:wrap}
.book small{font-weight:500;color:var(--soft);font-size:13px;text-shadow:none;flex-basis:100%;order:3;margin-top:-4px}
.book .rb{margin-left:auto;font-size:14px;color:var(--ink);background:var(--panel2);border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;text-shadow:none}
.cases{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.case{min-height:84px;background:var(--panel);border:2px solid var(--cc);border-radius:20px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:10px 12px;text-align:left;color:var(--ink);box-shadow:0 0 12px color-mix(in srgb,var(--cc) 40%,transparent),inset 0 0 14px color-mix(in srgb,var(--cc) 14%,transparent)}
.case .cn{font-size:13px;font-weight:700;color:var(--cc)}
.case .ct{font-size:17px;font-weight:600;line-height:1.15;overflow-wrap:anywhere;hyphens:auto}
.case .ck{font-size:12px;color:var(--green);font-weight:600}
.case.done{background:linear-gradient(160deg,#1f3a2c,var(--panel) 60%)}
.empty{color:var(--soft);font-size:14px}

/* Fall */
.caseHead{text-align:center;margin:6px 0 14px}
.caseHead h1{margin:0;font-size:30px;color:var(--case);text-shadow:0 0 16px var(--case)}
.caseHead p{margin:6px 0 0;font-size:15px;color:var(--soft)}
.suspects{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px;margin-bottom:16px}
.sus{display:flex;flex-direction:column;align-items:center;text-align:center;border-radius:20px;padding:5px 3px 3px;transition:box-shadow .15s,background .15s}
.pol{background:#fff;padding:6px 6px 0;box-shadow:0 3px 8px #0008;border:1.5px solid #333;width:88%;color:#1a1520}
.pol svg{display:block;width:100%;aspect-ratio:1;border:1.5px solid #333}
.pol .nm{font-family:"Dancing Script",cursive;font-size:22px;font-weight:700;line-height:1.25;padding:2px 0 3px}
.sus.victim .pol{background:#f6dede}
.clue{background:var(--panel2);border:1.5px solid var(--line);border-radius:16px;padding:7px 8px;margin-top:-4px;font-size:13.5px;line-height:1.25;width:100%;color:#e9e3ff}
.clue b{font-weight:700;color:var(--yel)}
.sus.on{background:#ff2d6f22;box-shadow:0 0 0 2.5px var(--pink),0 0 22px #ff2d6f88}
.sus.placed .pol{opacity:.45}
.sus.placed .clue{opacity:.6}

.bwrap{position:relative;margin:0 auto;touch-action:manipulation;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.board{position:absolute;border:5px solid var(--wall);background:var(--wall);touch-action:manipulation;border-radius:4px;box-shadow:0 0 0 2px var(--case),0 0 26px var(--case),0 0 60px #7a3cff55}
.cell{position:absolute;outline:1px solid rgba(30,30,40,.55);outline-offset:-0.5px}
.wall{position:absolute;background:var(--wall);z-index:3;pointer-events:none}
.ov{position:absolute;pointer-events:none;z-index:2}
.win{position:absolute;z-index:5;pointer-events:none}
.rlab{position:absolute;z-index:6;transform:translate(-50%,0);background:#fbf8ef;color:#1b1a20;border:2px solid var(--wall);border-radius:999px;padding:1px 9px;font-family:"Zilla Slab",Georgia,serif;font-weight:700;text-transform:uppercase;white-space:nowrap;pointer-events:none;letter-spacing:.2px}
.mark{position:absolute;z-index:7;display:grid;place-items:center;pointer-events:none}
.mark .tok{width:72%;height:72%;border-radius:50%;background:#fff;color:#1b1a20;border:2.5px solid var(--wall);display:grid;place-items:center;font-family:"Kalam",cursive;font-weight:700;line-height:1}
.mark .tok.vic{background:#e7b9c4}
.mark .tok.bad{border-color:#d22;box-shadow:0 0 0 3px #f66}
.mark svg{width:70%;height:70%}
.mark.auto svg{opacity:1}
.notes{position:absolute;z-index:7;pointer-events:none}
.notes span{position:absolute;width:38%;height:38%;display:grid;place-items:center;border-radius:50%;background:#fffd;color:#1b1a20;border:1.5px solid var(--wall);font-family:"Kalam",cursive;font-weight:700;line-height:1}
.notes span.vic{background:#f1c9d2}
.axl{position:absolute;display:grid;place-items:center;font-size:12px;color:var(--soft);font-weight:600}
.cmp{position:absolute;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--lav);font-size:15px;font-weight:700;text-shadow:0 0 8px #b69cff}
.cmp i{display:block;background:#6a58a8}
.infos{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:0 0 16px}
.info{background:#cdc6ea;color:#1b1a20;border-radius:18px;padding:10px 14px;text-align:center;max-width:250px;box-shadow:0 4px 0 #0005;font-family:"Zilla Slab",Georgia,serif}
.info b{display:block;font-size:19px;line-height:1.1}
.info span{display:block;font-size:14px;line-height:1.25;margin:4px 0 6px}
.info svg{display:block;margin:0 auto}
.howto{text-align:center;font-size:13px;color:var(--soft);margin:2px 0 8px}

.tools{display:flex;gap:8px;margin:16px 0 8px}
.tools button{flex:1;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:12px 4px;font-weight:700;font-size:15px}
.tools button.on{background:var(--lav);border-color:var(--lav);color:#1a1033;box-shadow:0 0 16px #b69cffaa}
#checkBtn{border-color:var(--green);color:var(--green);box-shadow:0 0 12px #3ef07a44}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bar button{background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:6px 10px;font-size:13.5px;font-weight:600}
.bar button.on{background:var(--lav);color:#1a1033}
#hintBtn{border-color:var(--yel);color:var(--yel)}
#solBtn{border-color:var(--pink);color:#ff7aa4}
.timer{margin-left:auto;font-weight:700;color:var(--cyan);text-shadow:0 0 10px #4dd2ff;font-variant-numeric:tabular-nums}

.verdict{margin:22px auto 0;width:82%;background:#efe9dc;color:#1b1a20;padding:14px 16px 18px;box-shadow:0 0 22px #ff2d6f55;transform:rotate(-1deg);clip-path:polygon(0 0,100% 0,100% 100%,62% 100%,60% 94%,57% 100%,0 100%);text-align:left;display:block;font-family:"Zilla Slab",Georgia,serif}
.verdict .l{font-size:15px}
.verdict .v{border-bottom:2px solid #333;min-height:30px;margin-top:6px;font-family:"Dancing Script",cursive;font-size:26px;text-align:center}

/* Modal */
.modal{position:fixed;inset:0;background:#07040fcc;display:grid;place-items:center;z-index:50;padding:16px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.box{background:var(--panel);border:2px solid var(--lav);border-radius:26px;padding:20px;max-width:420px;width:100%;max-height:86vh;overflow:auto;text-align:center;box-shadow:0 0 30px #b69cff55;color:var(--ink)}
.box h2{margin:0 0 10px;color:var(--lav);text-shadow:0 0 12px #b69cff88}
.box p{margin:0 0 14px;color:var(--soft)}
.box.rules{text-align:left}
.box.wide{max-width:540px;padding:16px 12px}
.box.rules h3{margin:14px 0 4px;color:var(--yel)}
.box.rules ul{margin:0;padding-left:18px;line-height:1.45;font-size:15px}
.box.rules b{color:var(--cyan)}
.objs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.objs div{background:#fff;color:#1b1a20;border-radius:12px;padding:4px;text-align:center;font-size:12px;width:66px}
.objs svg{width:44px;height:44px;display:block;margin:0 auto}
.objs.ok div{background:#c9f2cf}.objs.no div{background:#ffc9d4}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px}
.choices button{background:#fff;color:#1b1a20;border-radius:14px;padding:6px 4px;font-family:"Dancing Script",cursive;font-size:20px;font-weight:700}
.choices svg{width:52px;height:52px;display:block;margin:0 auto 2px;border:1.5px solid #333}
.btn{background:var(--lav);color:#1a1033;border-radius:14px;padding:11px 18px;font-weight:700;margin:4px;box-shadow:0 0 14px #b69cff88}
.btn.sec{background:var(--panel2);color:var(--ink);box-shadow:none;border:1.5px solid var(--line)}
.badge{display:inline-grid;place-items:center;width:1.45em;height:1.45em;border-radius:50%;color:#fff;font-weight:700;font-family:"Zilla Slab",serif;font-size:.95em;vertical-align:-.25em;margin:0 1px;box-shadow:inset 0 -2px 0 #0003,0 0 8px #fff3}
.badge.vic{color:#3a1a20}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--panel2);border:1.5px solid var(--lav);color:#fff;padding:11px 18px;border-radius:16px;font-size:14px;z-index:60;max-width:90vw;text-align:center;box-shadow:0 0 18px #b69cff66}
</style>
</head>
<body>

<div class="top">
  <button class="back hidden" id="backBtn">‹</button>
  <div class="brand" id="brand"></div>
  <div class="langs"><button data-l="de">DE</button><button data-l="tr">TR</button></div>
</div>

<div id="home" class="wrap">
  <div class="logo">
    <h1>MU<span class="d">R</span>DO<span class="d k">K</span>U</h1><br>
    <div class="pillT" id="pillT"></div>
  </div>
  <div class="player"><span data-t="player"></span><input id="nameIn" placeholder="Fırat" autocomplete="off"><span class="sync" id="syncSt"></span></div>
  <div id="bookList"></div>
</div>

<div id="game" class="wrap hidden">
  <div class="caseHead"><h1 id="cTitle"></h1><p id="cIntro"></p></div>
  <div class="suspects" id="suspects"></div>
  <div class="bar">
    <button id="undoBtn" data-t="undo"></button>
    <button id="resetBtn" data-t="reset"></button>
    <button id="hintBtn" data-t="hint"></button>
    <button id="solBtn" data-t="sol"></button>
    <button id="rulesBtn" data-t="rules"></button>
    <span class="timer" id="timer">0:00</span>
  </div>
  <div style="height:10px"></div>
  <div class="bwrap" id="board"></div>
  <div class="tools">
    <button id="toolPlace" data-t="toolPlace"></button>
    <button id="toolX" data-t="toolX"></button>
    <button id="checkBtn" data-t="check"></button>
  </div>
  <div class="howto" id="howto"></div>
  <button class="verdict" id="verdict"><div class="l" data-t="verdict"></div><div class="v" id="verdictName"></div></button>
  <div class="infos" id="infos" style="margin-top:26px"></div>
</div>

<div id="modal" class="modal hidden"><div class="box" id="mbox"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ============ FIREBASE (wie Chimera/Haushalt, Projekt "schulwegend") ============
   Leer lassen = Fortschritt nur lokal im Browser. */
const firebaseConfig = {
  apiKey: "",
  authDomain: "schulwegend.firebaseapp.com",
  databaseURL: "",
  projectId: "schulwegend",
  appId: ""
};

/* ============ SYMBOLE (SVG, Draufsicht) ============ */
const OL="#2b2a33";
const SVG={
 table:`<svg viewBox="0 0 100 100"><rect x="12" y="10" width="76" height="66" rx="3" fill="#aeb8c8" stroke="${OL}" stroke-width="4"/><rect x="12" y="62" width="76" height="14" fill="#5c6474" stroke="${OL}" stroke-width="4"/><rect x="20" y="76" width="9" height="14" fill="#5c6474" stroke="${OL}" stroke-width="3"/><rect x="71" y="76" width="9" height="14" fill="#5c6474" stroke="${OL}" stroke-width="3"/></svg>`,
 plant:`<svg viewBox="0 0 100 100"><ellipse cx="52" cy="84" rx="26" ry="10" fill="#33313b"/><path d="M30 58 L70 58 L64 86 L36 86 Z" fill="#6c8fc6" stroke="${OL}" stroke-width="4" stroke-linejoin="round"/><ellipse cx="50" cy="58" rx="20" ry="5" fill="#4f6fa3" stroke="${OL}" stroke-width="3"/><g fill="#5fae4f" stroke="#2f5d2a" stroke-width="3" stroke-linejoin="round"><path d="M50 58 C40 40 22 30 12 34 C26 38 38 48 46 60Z"/><path d="M50 58 C58 38 76 26 90 30 C76 36 62 48 54 60Z"/><path d="M50 58 C46 36 40 18 32 8 C44 18 52 36 54 58Z"/><path d="M50 58 C56 36 62 22 72 12 C64 26 58 42 54 60Z"/><path d="M50 58 C36 52 24 54 14 62 C28 58 40 60 48 62Z"/><path d="M50 58 C64 52 78 54 88 62 C74 58 62 60 52 62Z"/></g></svg>`,
 carpet:`<svg viewBox="0 0 100 100"><rect x="12" y="12" width="76" height="76" fill="#cfe3e6" stroke="${OL}" stroke-width="4"/><rect x="24" y="24" width="52" height="52" fill="none" stroke="${OL}" stroke-width="3"/><rect x="18" y="18" width="64" height="64" fill="none" stroke="#7aa0a6" stroke-width="2"/></svg>`,
 chair:chairSVG(),
 register:`<svg viewBox="0 0 100 100"><rect x="16" y="46" width="70" height="44" rx="5" fill="#6f7180" stroke="${OL}" stroke-width="4"/><rect x="16" y="46" width="70" height="12" fill="#8a8c9a" stroke="${OL}" stroke-width="4"/><rect x="22" y="12" width="58" height="40" rx="5" fill="#d9dbe2" stroke="${OL}" stroke-width="4"/><rect x="62" y="6" width="14" height="10" rx="2" fill="#d9dbe2" stroke="${OL}" stroke-width="3"/><g fill="#5a5c68">${[0,1,2].map(r=>[0,1,2].map(c=>`<rect x="${28+c*9}" y="${18+r*9}" width="6" height="6" rx="1"/>`).join("")).join("")}</g><rect x="58" y="18" width="5" height="26" rx="1.5" fill="#5a5c68"/><rect x="67" y="18" width="5" height="26" rx="1.5" fill="#5a5c68"/></svg>`,
 tv:`<svg viewBox="0 0 100 100"><rect x="10" y="44" width="80" height="44" rx="5" fill="#55576a" stroke="${OL}" stroke-width="4"/><rect x="20" y="12" width="60" height="52" rx="5" fill="#6d7084" stroke="${OL}" stroke-width="4"/><rect x="27" y="18" width="46" height="38" rx="2" fill="#f4f4f4" stroke="${OL}" stroke-width="3"/><text x="50" y="47" font-size="26" text-anchor="middle" fill="${OL}">♪</text></svg>`,
 shelf:`<svg viewBox="0 0 100 100"><rect x="12" y="8" width="76" height="84" fill="#7a5233" stroke="${OL}" stroke-width="4"/><g fill="#3a3a44"><rect x="18" y="14" width="64" height="20"/><rect x="18" y="40" width="64" height="20"/><rect x="18" y="66" width="64" height="20"/></g><g fill="#f0d468"><rect x="22" y="16" width="6" height="18"/><rect x="30" y="16" width="4" height="18"/><rect x="36" y="20" width="5" height="14" transform="rotate(-15 38 27)"/><rect x="58" y="42" width="6" height="18"/><rect x="66" y="42" width="4" height="18"/><rect x="72" y="42" width="5" height="18"/><rect x="24" y="68" width="5" height="18"/><rect x="31" y="68" width="5" height="18"/><rect x="38" y="68" width="5" height="18"/><rect x="45" y="68" width="5" height="18"/></g></svg>`,
 box:`<svg viewBox="0 0 100 100"><rect x="12" y="12" width="76" height="76" fill="#c9b08f" stroke="${OL}" stroke-width="4"/><line x1="50" y1="12" x2="50" y2="64" stroke="${OL}" stroke-width="3"/><line x1="12" y1="64" x2="88" y2="64" stroke="${OL}" stroke-width="3"/><rect x="12" y="64" width="76" height="24" fill="#b39a78" stroke="${OL}" stroke-width="4"/></svg>`
};
function bedSVG(w,h){ // Kopfende oben (bzw. links bei waagerecht)
  const W=w*100,H=h*100,vert=h>=w;
  if(vert) return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><rect x="10" y="8" width="${W-20}" height="${H-12}" rx="6" fill="#f4f1ea" stroke="${OL}" stroke-width="4"/><rect x="22" y="16" width="${W-44}" height="42" rx="10" fill="#fff" stroke="${OL}" stroke-width="3"/><rect x="10" y="76" width="${W-20}" height="${H-84}" rx="4" fill="#efeadf" stroke="${OL}" stroke-width="4"/><line x1="10" y1="${H-14}" x2="${W-10}" y2="${H-14}" stroke="#bbb4a4" stroke-width="3"/></svg>`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><rect x="8" y="10" width="${W-12}" height="${H-20}" rx="6" fill="#f4f1ea" stroke="${OL}" stroke-width="4"/><rect x="16" y="22" width="42" height="${H-44}" rx="10" fill="#fff" stroke="${OL}" stroke-width="3"/><rect x="76" y="10" width="${W-84}" height="${H-20}" rx="4" fill="#efeadf" stroke="${OL}" stroke-width="4"/></svg>`;
}
function tableSVG(w,h,col){const W=w*100,H=h*100,top=col||"#aeb8c8",band=col?shade(col,-35):"#5c6474";
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><rect x="10" y="10" width="${W-20}" height="${H-34}" rx="3" fill="${top}" stroke="${OL}" stroke-width="4"/><rect x="10" y="${H-38}" width="${W-20}" height="14" fill="${band}" stroke="${OL}" stroke-width="4"/><rect x="18" y="${H-24}" width="9" height="14" fill="${band}" stroke="${OL}" stroke-width="3"/><rect x="${W-27}" y="${H-24}" width="9" height="14" fill="${band}" stroke="${OL}" stroke-width="3"/></svg>`;}
function shade(hex,p){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(v+v*p/100)));return "#"+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,"0")).join("");}
function carpetSVG(w,h){const W=w*100,H=h*100;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><rect x="12" y="12" width="${W-24}" height="${H-24}" fill="#cfe3e6" stroke="${OL}" stroke-width="4"/><rect x="18" y="18" width="${W-36}" height="${H-36}" fill="none" stroke="#7aa0a6" stroke-width="2"/><rect x="24" y="24" width="${W-48}" height="${H-48}" fill="none" stroke="${OL}" stroke-width="3"/></svg>`;}

let lang=localStorage.getItem("mk_lang")||"de";
let player=localStorage.getItem("mk_name")||"";
let solved=JSON.parse(localStorage.getItem("mk_solved")||"{}");

/* ============ FIREBASE ============ */
function fbInit(){
  if(!firebaseConfig.apiKey||!firebaseConfig.databaseURL||typeof firebase==="undefined"){updSync();return;}
  try{firebase.initializeApp(firebaseConfig);
    firebase.auth().signInAnonymously().then(()=>{db=firebase.database();fbOn=true;updSync();pullSolved();}).catch(updSync);
  }catch(e){updSync();}
}
const pkey=()=>player.trim().toLowerCase().replace(/[.#$\[\]\/]/g,"_");
function updSync(){$("syncSt").textContent=(fbOn&&player)?"☁️ "+tt("online"):"📱 "+tt("local");}
function pullSolved(){if(!fbOn||!player)return;
  db.ref("murdoku/players/"+pkey()+"/solved").once("value").then(s=>{Object.assign(solved,s.val()||{});localStorage.setItem("mk_solved",JSON.stringify(solved));renderHome();});}
function pushSolved(id){localStorage.setItem("mk_solved",JSON.stringify(solved));
  if(fbOn&&player)db.ref("murdoku/players/"+pkey()+"/solved/"+id).set(solved[id]);}

/* ============ SPRACHE ============ */
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll(".langs button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=tt(e.dataset.t));
  $("pillT").innerHTML=tt("pill");
  updSync(); renderHome(); if(L)renderGame();
}
document.querySelectorAll(".langs button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;localStorage.setItem("mk_lang",lang);applyLang();});

/* ============ START ============ */
function caseColor(l){if(l.glow)return l.glow;const h=Math.round((l.no*137.508+(l.book.charCodeAt(1)||0)*40)%360);return `hsl(${h} 95% 66%)`;}
function renderHome(){
  const box=$("bookList");box.innerHTML="";
  BOOKS.forEach(bk=>{
    const ls=LEVELS.filter(l=>l.book===bk.id).sort((a,b)=>a.no-b.no);
    const h=document.createElement("div");h.className="book";
    h.innerHTML=`${loc(bk)} <small>${loc(bk.sub)}</small><button class="rb">${tt("rules")}</button>`;
    h.querySelector(".rb").onclick=()=>showRules(bk);
    box.appendChild(h);
    if(!ls.length){const e=document.createElement("div");e.className="empty";e.textContent=tt("noCases");box.appendChild(e);return;}
    const g=document.createElement("div");g.className="cases";
    ls.forEach(l=>{const b=document.createElement("button");b.className="case"+(solved[l.id]?" done":"");b.style.setProperty("--cc",caseColor(l));
      b.innerHTML=`<span class="cn">${l.no}</span><span class="ct">${loc(l.title)}</span>${solved[l.id]?`<span class="ck">✓ ${fmt(solved[l.id].time)}</span>`:""}`;
      b.onclick=()=>openLevel(l.id);g.appendChild(b);});
    box.appendChild(g);
  });
}
$("nameIn").value=player;
$("nameIn").onchange=e=>{player=e.target.value.trim();localStorage.setItem("mk_name",player);updSync();pullSolved();};

function showRules(bk){
  const objRow=(list,cls)=>`<div class="objs ${cls}">${list.map(k=>`<div>${k==="bed"?bedSVG(2,1):SVG[k]}${loc(OBJ[k])}</div>`).join("")}</div>`;
  modal(`<h2>${loc(bk)} – ${tt("rules")}</h2>${bk.rules?loc(bk.rules):`<p>${tt("noRules")}</p>`}
   <h3>${tt("occ")}</h3>${objRow(bk.occ,"ok")}<h3>${tt("noocc")}</h3>${objRow(bk.noocc,"no")}
   <div class="objs"><div>${WINDOW_SVG(false)}${loc(OBJ.window)}</div></div>
   <div style="text-align:center"><button class="btn" id="mN">OK</button></div>`,()=>$("mN").onclick=hideModal,"rules");
}

/* ============ SPIEL ============ */
function openLevel(id){
  L=LEVELS.find(l=>l.id===id); BK=BOOKS.find(b=>b.id===L.book);
  const s=JSON.parse(localStorage.getItem("mk_b_"+id)||"null");
  board=s?s.b:{pos:{},x:{},n:{}};board.n=board.n||{}; tAcc=s?s.t:0; accused=null;
  hist=[];sel=L.people.find(p=>!board.pos[p.id])?.id||null;tool="place";showErr=false;
  document.documentElement.style.setProperty("--case",caseColor(L));
  $("home").classList.add("hidden");$("game").classList.remove("hidden");$("backBtn").classList.remove("hidden");
  startTimer();renderGame();window.scrollTo(0,0);
}
function closeLevel(){saveBoard();stopTimer();L=null;
  document.documentElement.style.setProperty("--case","#b69cff");
  $("game").classList.add("hidden");$("home").classList.remove("hidden");$("backBtn").classList.add("hidden");$("brand").textContent="";renderHome();}
$("backBtn").onclick=closeLevel;
function saveBoard(){if(L)localStorage.setItem("mk_b_"+L.id,JSON.stringify({b:board,t:elapsed()}));}

function cellsOf(o){const a=[];for(let i=0;i<(o.h||1);i++)for(let j=0;j<(o.w||1);j++)a.push([o.r+i,o.c+j]);return a;}
function objAt(r,c){return L.objects.find(o=>o.t!=="window"&&cellsOf(o).some(([a,b])=>a===r&&b===c));}
function isBlocked(r,c){const o=objAt(r,c);return !!o&&(BK.noocc.includes(o.t)||(OBJ[o.t]&&OBJ[o.t].occ===false));}
function whoAt(r,c){return Object.keys(board.pos).find(k=>board.pos[k][0]===r&&board.pos[k][1]===c);}
function letter(p){return p.k||p.name[0];}

function renderGame(){
  $("brand").textContent=`${loc(BK)} · ${L.no}`;
  $("cTitle").textContent=`${L.no}. ${loc(L.title)}`;
  $("cIntro").innerHTML=loc(L.intro)+(L.note?`<br><span style="color:var(--yel);font-weight:600">${loc(L.note)}</span>`:"");
  renderInfos();
  // Verdächtige
  const sp=$("suspects");sp.innerHTML="";
  L.people.forEach(p=>{
    const d=document.createElement("button");
    d.className="sus"+(p.victim?" victim":"")+(sel===p.id?" on":"")+(board.pos[p.id]?" placed":"");
    d.innerHTML=`<div class="pol">${avatar(p)}<div class="nm" style="font-size:${p.name.length>8?17:p.name.length>6?19:22}px">${p.name}</div></div><div class="clue">${bold(loc(p))}</div>`;
    d.onclick=()=>{sel=p.id;tool="place";renderGame();};
    sp.appendChild(d);
  });
  drawBoard($("board"),Math.min(window.innerWidth-28,532),false);
  $("toolPlace").classList.toggle("on",tool==="place");$("toolX").classList.toggle("on",tool==="x");
  $("howto").textContent=tool==="x"?"":tt("howto");
  $("verdictName").textContent=accused?L.people.find(p=>p.id===accused).name:"";
}

function drawBoard(B,W,sol){
  const n=L.size, cb=20, lw=24, th=18;
  const cs=Math.floor((W-2*cb-lw-10)/n), bs=cs*n+10, W2=cb+lw+bs+cb, H2=cb+th+bs+cb;
  B.style.width=W2+"px";B.style.height=H2+"px";B.innerHTML="";
  const G=document.createElement("div");G.className="board";G.style.cssText=`left:${cb+lw}px;top:${cb+th}px;width:${bs}px;height:${bs}px`;B.appendChild(G);
  const inner=document.createElement("div");inner.style.cssText=`position:absolute;left:0;top:0;width:${cs*n}px;height:${cs*n}px`;G.appendChild(inner);
  const lab=(cls,css,html)=>{const e=document.createElement("div");e.className=cls;e.style.cssText=css;e.innerHTML=html;B.appendChild(e);};
  const RL=lang==="tr"?"S":"Z", CL=lang==="tr"?"Sü":"S";
  for(let i=0;i<n;i++){
    lab("axl",`left:${cb}px;top:${cb+th+5+i*cs}px;width:${lw}px;height:${cs}px`,RL+(i+1));
    lab("axl",`left:${cb+lw+5+i*cs}px;top:${cb}px;width:${cs}px;height:${th}px`,CL+(i+1));
  }
  const cp=tt("compass"), lineH=w=>`<i style="width:${w}px;height:1.5px"></i>`, lineV=h=>`<i style="height:${h}px;width:1.5px"></i>`;
  const midX=cb+lw+bs/2, midY=cb+th+bs/2, ll=bs*0.3;
  lab("cmp",`left:${cb+lw}px;top:0;width:${bs}px;height:${cb}px`,lineH(ll)+cp[0]+lineH(ll));
  lab("cmp",`left:${cb+lw}px;top:${H2-cb}px;width:${bs}px;height:${cb}px`,lineH(ll)+cp[2]+lineH(ll));
  lab("cmp",`left:0;top:${cb+th}px;width:${cb}px;height:${bs}px;flex-direction:column`,lineV(ll)+cp[3]+lineV(ll));
  lab("cmp",`left:${W2-cb}px;top:${cb+th}px;width:${cb}px;height:${bs}px;flex-direction:column`,lineV(ll)+cp[1]+lineV(ll));
  const add=(cls,css,html)=>{const e=document.createElement("div");e.className=cls;e.style.cssText=css;if(html)e.innerHTML=html;inner.appendChild(e);return e;};
  const P=sol?L.solution:board.pos;
  const rows={},cols={};Object.values(P).forEach(([r,c])=>{rows[r]=(rows[r]||0)+1;cols[c]=(cols[c]||0)+1;});
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    const rn=L.roomNames[L.rooms[r][c]],f=FLOORS[rn.floor]||FLOORS.plain;
    const e=add("cell",`left:${c*cs}px;top:${r*cs}px;width:${cs}px;height:${cs}px;${f(rn.a,rn.b)}`);
    if(!sol)bindCell(e,r,c);
  }
  // Wände
  const wt=Math.max(4,Math.round(cs*.07));
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    if(c<n-1&&L.rooms[r][c]!==L.rooms[r][c+1])add("wall",`left:${(c+1)*cs-wt/2}px;top:${r*cs-wt/2}px;width:${wt}px;height:${cs+wt}px`);
    if(r<n-1&&L.rooms[r][c]!==L.rooms[r+1][c])add("wall",`left:${c*cs-wt/2}px;top:${(r+1)*cs-wt/2}px;width:${cs+wt}px;height:${wt}px`);
  }
  // Objekte
  L.objects.forEach(o=>{
    if(o.t==="window"){
      const horiz=o.side==="top"||o.side==="bottom", L1=cs*.66, T1=cs*.24;
      // Mittellinie der Wand: Außenrand = Mitte des 5px-Rahmens, innen = Wandlinie
      const edge=(o.side==="top"&&o.r===0)?-2.5:(o.side==="bottom"&&o.r===n-1)?n*cs+2.5:(o.side==="left"&&o.c===0)?-2.5:(o.side==="right"&&o.c===n-1)?n*cs+2.5:null;
      let x,y,w,h;
      if(horiz){w=L1;h=T1;x=o.c*cs+(cs-w)/2;const ly=edge!==null?edge:(o.side==="top"?o.r*cs:(o.r+1)*cs);y=ly-h/2;}
      else{w=T1;h=L1;y=o.r*cs+(cs-h)/2;const lx=edge!==null?edge:(o.side==="left"?o.c*cs:(o.c+1)*cs);x=lx-w/2;}
      add("win",`left:${x}px;top:${y}px;width:${w}px;height:${h}px`,WINDOW_SVG(horiz)).firstChild.setAttribute("style","width:100%;height:100%;display:block");return;
    }
    const w=(o.w||1),h=(o.h||1);
    const multi=w>1||h>1;
    const html=o.t==="bed"?(o.col?bigBedSVG(w,h,o.col):bedSVG(w,h)):(o.t==="table"&&(multi||o.col))?tableSVG(w,h,o.col):(multi&&o.t==="carpet")?carpetSVG(w,h):o.t==="chair"?chairSVG(o.col):SVG[o.t]||"";
    add("ov",`left:${o.c*cs}px;top:${o.r*cs}px;width:${w*cs}px;height:${h*cs}px`,html).firstChild?.setAttribute("style","width:100%;height:100%;display:block");
  });
  // Raumschilder (unten mittig im Raum)
  Object.keys(L.roomNames).forEach(k=>{
    let r0=99,r1=-1,c0=99,c1=-1;
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(L.rooms[r][c]===k){r0=Math.min(r0,r);r1=Math.max(r1,r);c0=Math.min(c0,c);c1=Math.max(c1,c);}
    if(r1<0)return;
    const rn=L.roomNames[k], txt=loc(rn);
    // Breite der untersten Zeile des Raums (für Schriftgröße)
    let bc0=99,bc1=-1;for(let c=0;c<n;c++)if(L.rooms[r1][c]===k){bc0=Math.min(bc0,c);bc1=Math.max(bc1,c);}
    // freien Platz in der untersten Zeile suchen (Felder ohne Objekt), längste Strecke, bei Gleichstand links
    let best=null,run=null;
    for(let c=bc0;c<=bc1+1;c++){
      const free=c<=bc1&&L.rooms[r1][c]===k&&!objAt(r1,c);
      if(free){if(!run)run=[c,c];else run[1]=c;}
      else if(run){if(!best||run[1]-run[0]>best[1]-best[0])best=run;run=null;}
    }
    const roomW=bc1-bc0+1;
    let lc,lw2;
    if(best&&(best[1]-best[0]+1)>=2){lw2=Math.min(roomW,best[1]-best[0]+2);lc=(best[0]+best[1]+1)/2;}
    else{lw2=roomW;lc=(bc0+bc1+1)/2;}
    let top=rn.top;
    if(top){ // Schild oben im Raum (wie im Buch)
      let tc0=99,tc1=-1;for(let c=0;c<n;c++)if(L.rooms[r0][c]===k){tc0=Math.min(tc0,c);tc1=Math.max(tc1,c);}
      lc=(tc0+tc1+1)/2;lw2=tc1-tc0+1;
    }
    const fs=Math.max(7,Math.min(14,cs*.2,(lw2*cs*.94-20)/(txt.length*.68)));
    const estW=(txt.length*.68*fs+20)/cs;
    if(!top)lc=Math.max(bc0+estW/2,Math.min(bc1+1-estW/2,lc));
    const ty=top?r0*cs+fs*.5:(r1+1)*cs-fs*1.9;
    const e=add("rlab",`left:${lc*cs}px;top:${ty}px;font-size:${fs}px;padding:1px ${Math.max(4,fs*.6)}px`);e.textContent=txt;
  });
  // Markierungen
  if(sol){
    Object.entries(L.solution).forEach(([id,[r,c]])=>{
      const p=L.people.find(p=>p.id===id);
      add("mark",`left:${c*cs}px;top:${r*cs-cs*.08}px;width:${cs}px;height:${cs}px`,pawnSVG(p,id===L.murderer));
    });
    return;
  }
  // Markierungen
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    const who=whoAt(r,c),css=`left:${c*cs}px;top:${r*cs}px;width:${cs}px;height:${cs}px`,key=r+","+c;
    if(who){
      const p=L.people.find(p=>p.id===who);
      const bad=(rows[r]>1||cols[c]>1)||(showErr&&(L.solution[who][0]!==r||L.solution[who][1]!==c));
      add("mark",css,`<div class="tok${p.victim?" vic":""}${bad?" bad":""}" style="font-size:${cs*.42}px">${letter(p)}</div>`);
    }else if(board.x[key]) add("mark",css,XSVG);
    else if((rows[r]||cols[c])&&!isBlocked(r,c)) add("mark auto",css,XSVG);
    else if(board.n[key]&&board.n[key].length){
      const pos=[["3%","3%"],["3%","59%"],["59%","3%"],["59%","59%"]];
      add("notes",css,board.n[key].slice(0,4).map((id,i)=>{const p=L.people.find(p=>p.id===id);
        return `<span class="${p.victim?"vic":""}" style="top:${pos[i][0]};left:${pos[i][1]};font-size:${cs*.22}px">${letter(p)}</span>`;}).join(""));
    }
  }
}
function infoDiagram(rows){
  const cs=26,R=rows.length,C=Math.max(...rows.map(r=>r.length)),pad=3;
  const ch=(r,c)=>(r<0||r>=R||c<0||c>=(rows[r]||"").length)?" ":rows[r][c];
  const reg=x=>x===" "?"x":(",V".includes(x)?"g":"w");
  let o="";
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){const x=ch(r,c);if(x===" ")continue;
    const X=pad+c*cs,Y=pad+r*cs;
    o+=`<rect x="${X}" y="${Y}" width="${cs}" height="${cs}" fill="${reg(x)==="g"?"#b9d99c":"#f4f1e6"}" stroke="#555" stroke-width="1"/>`;
    if("vV".includes(x))o+=`<path d="M${X+6} ${Y+13} L${X+11} ${Y+19} L${X+20} ${Y+7}" stroke="#3f8a3a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
    if(x==="x")o+=`<path d="M${X+7} ${Y+7} L${X+cs-7} ${Y+cs-7} M${X+cs-7} ${Y+7} L${X+7} ${Y+cs-7}" stroke="#1b1a20" stroke-width="4" stroke-linecap="round"/>`;
    if(x==="A")o+=`<rect x="${X+3}" y="${Y+2}" width="${cs-6}" height="${cs-4}" rx="3" fill="#efe3c4" stroke="#555" stroke-width="1"/><text x="${X+cs/2}" y="${Y+cs*.72}" font-size="17" font-weight="700" text-anchor="middle" font-family="Kalam,cursive" fill="#1b1a20">A</text>`;
    if(x==="a")o+=`<text x="${X+cs/2}" y="${Y+cs*.72}" font-size="19" font-weight="700" text-anchor="middle" font-family="Zilla Slab,Georgia,serif" fill="#1b1a20">a</text>`;
  }
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){const x=ch(r,c);if(x===" ")continue;const X=pad+c*cs,Y=pad+r*cs,me=reg(x);
    if(reg(ch(r-1,c))!==me)o+=`<line x1="${X}" y1="${Y}" x2="${X+cs}" y2="${Y}" stroke="#1b1a20" stroke-width="3.5" stroke-linecap="square"/>`;
    if(reg(ch(r+1,c))!==me)o+=`<line x1="${X}" y1="${Y+cs}" x2="${X+cs}" y2="${Y+cs}" stroke="#1b1a20" stroke-width="3.5" stroke-linecap="square"/>`;
    if(reg(ch(r,c-1))!==me)o+=`<line x1="${X}" y1="${Y}" x2="${X}" y2="${Y+cs}" stroke="#1b1a20" stroke-width="3.5" stroke-linecap="square"/>`;
    if(reg(ch(r,c+1))!==me)o+=`<line x1="${X+cs}" y1="${Y}" x2="${X+cs}" y2="${Y+cs}" stroke="#1b1a20" stroke-width="3.5" stroke-linecap="square"/>`;
  }
  return `<svg width="${C*cs+pad*2}" height="${R*cs+pad*2}" viewBox="0 0 ${C*cs+pad*2} ${R*cs+pad*2}">${o}</svg>`;
}
function renderInfos(){
  const box=$("infos");box.innerHTML="";
  (L.info||[]).forEach(i=>{const d=document.createElement("div");d.className="info";
    const pic=i.icon?`<div style="width:64px;height:64px;margin:0 auto">${SVG[i.icon].replace("<svg",'<svg style="width:100%;height:100%"')}</div>`:i.grid?infoDiagram(i.grid):"";
    d.innerHTML=`<b>${loc(i.title)}</b>${i.icon?pic+`<span>${loc(i.text)}</span>`:`<span>${loc(i.text)}</span>`+pic}`;box.appendChild(d);});
}
function snap(){hist.push(JSON.stringify(board));if(hist.length>300)hist.shift();}
function lineBlocked(r,c){return Object.values(board.pos).some(([a,b])=>a===r||b===c);}
function tap(r,c){ // kurzer Tipp
  const who=whoAt(r,c),key=r+","+c;
  if(tool==="x"){if(who)return;snap();board.x[key]?delete board.x[key]:board.x[key]=1;}
  else{
    if(who){toast(tt("howto"));return;}
    if(!sel){toast(tt("pickFirst"));return;}
    if(isBlocked(r,c)){toast(tt("cantSit"));return;}
    if(lineBlocked(r,c)){toast(tt("xBlocked"));return;}
    const a=board.n[key]||[];
    snap();
    if(a.includes(sel))board.n[key]=a.filter(x=>x!==sel);
    else{if(a.length>=4){hist.pop();toast(tt("maxNotes"));return;}board.n[key]=[...a,sel];delete board.x[key];}
    if(!board.n[key].length)delete board.n[key];
  }
  showErr=false;accused=null;saveBoard();renderGame();
}
function placeSure(id,r,c){ // sicher setzen
  board.pos[id]=[r,c];
  const key=r+","+c;delete board.x[key];delete board.n[key];
  for(const k of Object.keys(board.n)){ // Vermutungen dieser Person + in Zeile/Spalte löschen
    const [a,b]=k.split(",").map(Number);
    board.n[k]=board.n[k].filter(x=>x!==id);
    if(a===r||b===c||!board.n[k].length)delete board.n[k];
  }
}
function hold(r,c){ // gedrückt halten
  if(tool==="x")return;
  const who=whoAt(r,c);
  if(who){snap();delete board.pos[who];sel=who;}
  else{
    if(!sel){toast(tt("pickFirst"));return;}
    if(isBlocked(r,c)){toast(tt("cantSit"));return;}
    snap();if(board.pos[sel])delete board.pos[sel];
    placeSure(sel,r,c);
    sel=L.people.find(p=>!board.pos[p.id])?.id||null;
  }
  if(navigator.vibrate)navigator.vibrate(30);
  showErr=false;accused=null;saveBoard();renderGame();
}
function bindCell(e,r,c){
  let t=null,fired=false,sx=0,sy=0;
  e.addEventListener("pointerdown",ev=>{fired=false;sx=ev.clientX;sy=ev.clientY;clearTimeout(t);t=setTimeout(()=>{fired=true;t=null;hold(r,c);},450);});
  e.addEventListener("pointermove",ev=>{if(t&&(Math.abs(ev.clientX-sx)>10||Math.abs(ev.clientY-sy)>10)){clearTimeout(t);t=null;fired=true;}});
  e.addEventListener("pointerup",ev=>{if(t){clearTimeout(t);t=null;if(!fired)tap(r,c);}});
  e.addEventListener("pointercancel",()=>{clearTimeout(t);t=null;});
  e.addEventListener("contextmenu",ev=>ev.preventDefault());
}
$("toolPlace").onclick=()=>{tool="place";renderGame();};
$("toolX").onclick=()=>{tool="x";renderGame();};
$("rulesBtn").onclick=()=>showRules(BK);
$("undoBtn").onclick=()=>{if(!hist.length)return;board=JSON.parse(hist.pop());saveBoard();renderGame();};
$("resetBtn").onclick=()=>modal(`<h2>${tt("resetQ")}</h2><button class="btn" id="mY">${tt("yes")}</button><button class="btn sec" id="mN">${tt("no")}</button>`,
  ()=>{$("mY").onclick=()=>{board={pos:{},x:{},n:{}};hist=[];tAcc=0;accused=null;sel=L.people[0].id;startTimer();hideModal();saveBoard();renderGame();};$("mN").onclick=hideModal;});
$("hintBtn").onclick=()=>modal(`<h2>${tt("hintQ")}</h2><p>${tt("hintQTxt")}</p><button class="btn" id="mY">${tt("yes")}</button><button class="btn sec" id="mN">${tt("no")}</button>`,
  ()=>{$("mY").onclick=()=>{hideModal();doHint();};$("mN").onclick=hideModal;});
function doHint(){
  const wrong=Object.keys(board.pos).find(k=>board.pos[k][0]!==L.solution[k][0]||board.pos[k][1]!==L.solution[k][1]);
  snap();
  if(wrong){delete board.pos[wrong];toast(tt("hintFix")(L.people.find(p=>p.id===wrong).name));}
  else{
    const order=L.hintOrder||L.people.map(p=>p.id);
    const id=order.find(id=>!board.pos[id]);if(!id){hist.pop();return;}
    placeSure(id,...L.solution[id]);
    sel=L.people.find(p=>!board.pos[p.id])?.id||null;
    saveBoard();renderGame();
    const i=order.indexOf(id), si=[].concat(L.hintSteps?L.hintSteps[i]:i), stA=L.steps&&L.steps[lang]||[];
    const st=si.filter(k=>stA[k]).map(k=>`<p style="color:var(--ink);font-size:16px;text-align:left"><b>${k+1}.</b> ${bold(stA[k])}</p>`).join("");
    if(st)modal(`<h2>${tt("stepT")} ${si.map(k=>k+1).join(" + ")}</h2>${st}<button class="btn" id="mN">OK</button>`,()=>$("mN").onclick=hideModal);
    else toast(tt("hintSet")(L.people.find(p=>p.id===id).name));
    return;
  }
  saveBoard();renderGame();
}
$("solBtn").onclick=()=>modal(`<h2>${tt("solQ")}</h2><p>${tt("solQTxt")}</p><button class="btn" id="mY">${tt("yes")}</button><button class="btn sec" id="mN">${tt("no")}</button>`,
  ()=>{$("mY").onclick=showSolution;$("mN").onclick=hideModal;});
function showSolution(){
  const st=(L.steps&&L.steps[lang])||[];
  const m=L.people.find(p=>p.id===L.murderer);
  modal(`<h2>${loc(L.title)}</h2>
   <div class="verdict" style="margin:0 auto 14px;cursor:default"><div class="l">${tt("verdict")}</div><div class="v">${m.name}</div></div>
   <div class="bwrap" id="solBoard" style="margin:0 auto 12px"></div>
   <ol style="text-align:left;padding-left:22px;line-height:1.5;font-size:15px;margin:0 0 12px">${st.map(x=>`<li style="margin-bottom:6px">${bold(x)}</li>`).join("")}</ol>
   <button class="btn" id="mN">${tt("close")}</button>`,
   ()=>{$("mN").onclick=hideModal;const bx=$("mbox");drawBoard($("solBoard"),Math.min(bx.clientWidth-44,500),true);},"wide");
}
function gridOk(){return L.people.every(p=>board.pos[p.id]&&board.pos[p.id][0]===L.solution[p.id][0]&&board.pos[p.id][1]===L.solution[p.id][1]);}
function check(){
  if(Object.keys(board.pos).length<L.people.length){toast(tt("notFull"));return;}
  if(!gridOk()){modal(`<h2>${tt("wrong")}</h2><p>${tt("wrongTxt")}</p><button class="btn" id="mE">${tt("showErr")}</button><button class="btn sec" id="mN">${tt("close")}</button>`,
    ()=>{$("mE").onclick=()=>{showErr=true;hideModal();renderGame();};$("mN").onclick=hideModal;});return;}
  const sus=L.people.filter(p=>!p.victim);
  modal(`<h2>${tt("who")}</h2><p>${tt("whoTxt")}</p><div class="choices">${sus.map(p=>`<button data-p="${p.id}">${avatar(p)}${p.name}</button>`).join("")}</div>`,
    ()=>document.querySelectorAll(".choices button").forEach(b=>b.onclick=()=>accuse(b.dataset.p)));
}
$("checkBtn").onclick=check;$("verdict").onclick=check;
function accuse(id){
  if(id===L.murderer){
    accused=id;stopTimer();const t=elapsed(),p=L.people.find(p=>p.id===id);
    const prev=solved[L.id];if(!prev||t<prev.time){solved[L.id]={time:t,date:new Date().toISOString().slice(0,10)};pushSolved(L.id);}
    renderGame();
    modal(`<h2>${tt("right")}</h2><p>${tt("rightTxt")(p.name,fmt(t))}</p><button class="btn" id="mB">${tt("back")}</button><button class="btn sec" id="mN">${tt("close")}</button>`,
      ()=>{$("mB").onclick=()=>{hideModal();closeLevel();};$("mN").onclick=hideModal;});
  }else modal(`<h2>${tt("wrongM")}</h2><p>${tt("wrongMTxt")}</p><button class="btn sec" id="mN">${tt("close")}</button>`,()=>$("mN").onclick=hideModal);
}

/* ============ HELFER ============ */
function modal(html,bind,cls){$("mbox").className="box"+(cls?" "+cls:"");$("mbox").innerHTML=html;$("modal").classList.remove("hidden");bind&&bind();}
function hideModal(){$("modal").classList.add("hidden");}
$("modal").onclick=e=>{if(e.target.id==="modal")hideModal();};
let toastT;function toast(m){let d=document.querySelector(".toast");if(!d){d=document.createElement("div");d.className="toast";document.body.appendChild(d);}d.textContent=m;clearTimeout(toastT);toastT=setTimeout(()=>d.remove(),2000);}
function elapsed(){return tAcc+(tStart?Math.floor((Date.now()-tStart)/1000):0);}
function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function startTimer(){stopTimer();tStart=Date.now();tInt=setInterval(()=>$("timer").textContent=fmt(elapsed()),1000);$("timer").textContent=fmt(elapsed());}
function stopTimer(){if(tStart){tAcc=elapsed();tStart=0;}clearInterval(tInt);}
document.addEventListener("visibilitychange",()=>{if(!L||accused)return;if(document.hidden){stopTimer();saveBoard();}else startTimer();});
window.addEventListener("resize",()=>{if(L)renderGame();});

fbInit();applyLang();
</script>
