<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Murdoku">
<meta name="theme-color" content="#1d1a2b">
<title>Murdoku</title>
<style>
:root{
  --bg:#1d1a2b; --panel:#2a2640; --panel2:#352f52; --ink:#f3efe6; --muted:#a9a3c2;
  --accent:#e0475b; --gold:#f2c14e; --ok:#4fbf7f; --line:#0e0c17;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.top{display:flex;align-items:center;gap:8px;padding:10px 14px;position:sticky;top:0;background:var(--bg);z-index:5}
.top h1{font-size:20px;margin:0;flex:1;letter-spacing:.5px}
.top h1 span{color:var(--accent)}
.pill{background:var(--panel);border-radius:999px;padding:7px 12px;font-size:14px}
.pill.on{background:var(--accent)}
.langs{display:flex;background:var(--panel);border-radius:999px;padding:3px}
.langs button{padding:5px 10px;border-radius:999px;font-size:13px;font-weight:600}
.langs button.on{background:var(--gold);color:#222}
.wrap{max-width:560px;margin:0 auto;padding:0 12px 40px}
.hidden{display:none!important}

/* home */
.player{background:var(--panel);border-radius:14px;padding:12px;margin:6px 0 14px;display:flex;gap:8px;align-items:center;font-size:14px}
.player input{flex:1;background:var(--panel2);border:0;border-radius:8px;padding:8px;color:var(--ink);font-size:15px}
.sync{font-size:12px;color:var(--muted)}
.book{margin:18px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--gold)}
.lvl{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.lvl .n{width:34px;height:34px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-weight:700}
.lvl .t{flex:1}
.lvl .t b{display:block;font-size:16px}
.lvl .t small{color:var(--muted)}
.lvl .st{font-size:20px}
.empty{color:var(--muted);font-size:14px;padding:6px 2px}

/* game */
.story{background:var(--panel);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.4;margin-bottom:10px}
.story b{color:var(--accent)}
.bar{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.timer{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.gridwrap{display:grid;gap:0;user-select:none;margin:0 auto}
.lab{display:grid;place-items:center;font-size:11px;color:var(--muted);font-weight:600}
.cell{position:relative;aspect-ratio:1;display:grid;place-items:center;border:1px solid rgba(0,0,0,.18);overflow:hidden}
.cell .obj{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cs)*.55);opacity:.95;pointer-events:none}
.cell.block .obj{filter:saturate(.8)}
.cell.block::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(0,0,0,.10) 0 4px,transparent 4px 8px);pointer-events:none}
.cell.dim::before{content:"";position:absolute;inset:0;background:rgba(20,15,40,.2);pointer-events:none;z-index:1}
.cell .x{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cs)*.6);color:rgba(30,20,40,.65);font-weight:800;z-index:2;pointer-events:none}
.cell .tok{position:relative;z-index:3;width:78%;height:78%;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:calc(var(--cs)*.38);color:#fff;border:2px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.cell .tok.bad{outline:3px solid var(--accent);outline-offset:1px}
.cell.sel{outline:3px solid var(--gold);outline-offset:-3px;z-index:4}

.tools{display:flex;gap:6px;margin:10px 0}
.tools button{flex:1;background:var(--panel);border-radius:12px;padding:10px 4px;font-size:13px}
.tools button.on{background:var(--gold);color:#222;font-weight:700}

.people{display:flex;flex-direction:column;gap:6px}
.person{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border-radius:14px;padding:9px 11px;text-align:left;width:100%;border:2px solid transparent}
.person.on{border-color:var(--gold);background:var(--panel2)}
.person.placed{opacity:.55}
.person .av{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;border:2px solid #fff}
.person .tx{font-size:14px;line-height:1.35}
.person .tx b{display:block;font-size:15px}
.person.victim .tx b::after{content:" †";color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;font-size:12px}
.legend span{background:var(--panel);border-radius:8px;padding:4px 8px}
.legend .no{color:var(--muted)}
.rules{font-size:13px;color:var(--muted);line-height:1.45;background:var(--panel);border-radius:14px;padding:10px 12px;margin-top:12px}
.rules ul{margin:4px 0 0;padding-left:18px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:20;padding:20px}
.box{background:var(--panel);border-radius:18px;padding:18px;max-width:380px;width:100%;text-align:center}
.box h2{margin:0 0 8px;font-size:20px}
.box p{color:var(--muted);font-size:14px;margin:0 0 12px}
.box .choices{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:10px}
.box .choices button{display:flex;align-items:center;gap:6px;background:var(--panel2);border-radius:999px;padding:6px 12px 6px 6px}
.box .choices .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}
.btn{background:var(--accent);border-radius:12px;padding:10px 16px;font-weight:700;margin:4px}
.btn.sec{background:var(--panel2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;box-shadow:0 4px 14px rgba(0,0,0,.4)}
</style>
</head>
<body>

<div class="top">
  <button id="backBtn" class="pill hidden">‹</button>
  <h1 id="title">MUR<span>DOKU</span></h1>
  <div class="langs"><button data-l="de">DE</button><button data-l="tr">TR</button></div>
</div>

<!-- HOME -->
<div id="home" class="wrap">
  <div class="player">
    <span data-t="player"></span>
    <input id="nameIn" placeholder="Fırat" autocomplete="off">
    <span class="sync" id="syncSt"></span>
  </div>
  <div id="levelList"></div>
  <div class="rules" id="rulesBox"></div>
</div>

<!-- GAME -->
<div id="game" class="wrap hidden">
  <div class="story" id="story"></div>
  <div class="bar">
    <button class="pill" id="undoBtn" data-t="undo"></button>
    <button class="pill" id="resetBtn" data-t="reset"></button>
    <button class="pill" id="hintBtn" data-t="hint"></button>
    <button class="pill" id="dimBtn" data-t="dim"></button>
    <span class="timer" id="timer">0:00</span>
  </div>
  <div id="grid" class="gridwrap"></div>
  <div class="tools">
    <button id="toolPlace" data-t="toolPlace"></button>
    <button id="toolX" data-t="toolX"></button>
    <button id="checkBtn" data-t="check"></button>
  </div>
  <div class="legend" id="legend"></div>
  <div class="people" id="people"></div>
</div>

<div id="modal" class="modal hidden"><div class="box" id="mbox"></div></div>

<!-- Firebase (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ===================== FIREBASE CONFIG =====================
   Hier dieselbe firebaseConfig wie bei Chimera/Haushalt einfügen
   (Projekt "schulwegend"). Leer lassen = nur lokal speichern. */
const firebaseConfig = {
  apiKey: "",
  authDomain: "schulwegend.firebaseapp.com",
  databaseURL: "",
  projectId: "schulwegend",
  appId: ""
};

/* ===================== OBJEKTE ===================== */
// occ = darf besetzt werden
const OBJ = {
  chair:  {e:"🪑", occ:true,  de:"Stuhl",     tr:"Sandalye"},
  sofa:   {e:"🛋️", occ:true,  de:"Sofa",      tr:"Kanepe"},
  bed:    {e:"🛏️", occ:true,  de:"Bett",      tr:"Yatak"},
  carpet: {e:"🟫", occ:true,  de:"Teppich",   tr:"Halı"},
  bench:  {e:"🪵", occ:true,  de:"Bank",      tr:"Bank"},
  car:    {e:"🚗", occ:true,  de:"Auto",      tr:"Araba"},
  puddle: {e:"💧", occ:true,  de:"Pfütze",    tr:"Su birikintisi"},
  oil:    {e:"🛢️", occ:true,  de:"Ölpfütze",  tr:"Yağ lekesi"},
  table:  {e:"🟤", occ:false, de:"Tisch",     tr:"Masa"},
  plant:  {e:"🪴", occ:false, de:"Pflanze",   tr:"Bitki"},
  tree:   {e:"🌳", occ:false, de:"Baum",      tr:"Ağaç"},
  shelf:  {e:"📚", occ:false, de:"Regal",     tr:"Raf"},
  tv:     {e:"📺", occ:false, de:"Fernseher", tr:"Televizyon"},
  stove:  {e:"🔥", occ:false, de:"Herd",      tr:"Ocak"}
};
const COLORS = ["#d94f5c","#3b82c4","#3fa36b","#e08a2c","#8e5cc4","#1fa7a7","#c4508e","#6b7a8f","#b0882e","#4a5bd4","#2e8b57","#a0522d","#7a4fc4","#d4704a","#3d9bd4","#9a9a2e"];

/* ===================== LEVELS =====================
   Format:
   rooms: ein String pro Zeile, ein Buchstabe = ein Raum
   roomNames: Buchstabe -> {de,tr,c(Farbe)}
   objects: [[zeile, spalte, typ], ...]  (0-basiert, A=0, Spalte 1=0)
   people: [{id,name,victim?,de,tr}]  (Hinweistexte)
   solution: {id:[zeile,spalte]}, murderer: id                         */
const LEVELS = [
{
  id:"demo-1", book:"demo", no:1, size:6, diff:{de:"Sehr leicht",tr:"Çok kolay"},
  title:{de:"Das stille Haus", tr:"Sessiz Ev"},
  story:{de:"Vera wurde in ihrem Haus ermordet. Wer war allein mit ihr?",
         tr:"Vera evinde öldürüldü. Onunla yalnız kalan kimdi?"},
  rooms:["KKKWWW","KKKWWW","SSLLWW","SSLLGG","SSLLGG","SSLLGG"],
  roomNames:{
    K:{de:"Küche",tr:"Mutfak",c:"#f3dfae"},
    W:{de:"Wohnzimmer",tr:"Oturma odası",c:"#cfe3f5"},
    S:{de:"Schlafzimmer",tr:"Yatak odası",c:"#e8d3ef"},
    L:{de:"Flur",tr:"Koridor",c:"#e9e2d6"},
    G:{de:"Garten",tr:"Bahçe",c:"#cdebc4"}
  },
  objects:[[0,0,"chair"],[0,2,"stove"],[1,1,"table"],[0,5,"tv"],[1,3,"sofa"],[1,4,"sofa"],[2,5,"plant"],
           [2,0,"shelf"],[3,0,"bed"],[4,0,"bed"],[5,0,"carpet"],[5,1,"carpet"],[2,3,"carpet"],[3,2,"plant"],
           [4,5,"tree"],[3,5,"bench"]],
  people:[
    {id:"anna",name:"Anna",de:"Ich saß in der Küche auf einem Stuhl.",tr:"Mutfakta bir sandalyede oturuyordum."},
    {id:"ben",name:"Ben",de:"Ich saß auf dem Sofa.",tr:"Kanepede oturuyordum."},
    {id:"clara",name:"Clara",de:"Ich war im Garten, neben einem Baum.",tr:"Bahçedeydim, bir ağacın yanında."},
    {id:"david",name:"David",de:"Ich stand im Schlafzimmer auf dem Teppich.",tr:"Yatak odasında halının üstünde duruyordum."},
    {id:"emil",name:"Emil",de:"Ich war im Flur.",tr:"Koridordaydım."},
    {id:"vera",name:"Vera",victim:true,de:"Vera lag auf einem Teppich im Flur.",tr:"Vera koridorda bir halının üstünde yatıyordu."}
  ],
  solution:{anna:[0,0],ben:[1,4],vera:[2,3],clara:[3,5],emil:[4,2],david:[5,1]},
  murderer:"emil"
}
];
const BOOKS = [
  {id:"online", de:"Online-Fälle (murdoku.com)", tr:"Online vakalar (murdoku.com)"},
  {id:"b1", de:"Band 1", tr:"1. Cilt"},
  {id:"b2", de:"Band 2 – Zurück in die Zeit", tr:"2. Cilt – Geçmişe Yolculuk"},
  {id:"b3", de:"Band 3 – Rund um die Welt", tr:"3. Cilt – Dünya Turu"},
  {id:"demo", de:"Übung", tr:"Alıştırma"}
];

/* ===================== TEXTE ===================== */
const T = {
 de:{player:"Spieler:",undo:"↶ Zurück",reset:"Neu",hint:"💡 Tipp",dim:"Linien",toolPlace:"👤 Person",toolX:"✕ Markieren",check:"✔ Prüfen",
     noLevels:"Noch keine Fälle.",solved:"gelöst",pickFirst:"Wähle zuerst unten eine Person.",cantSit:"Hier kann niemand stehen.",
     notFull:"Es sind noch nicht alle Personen platziert.",wrong:"Da stimmt etwas nicht.",wrongTxt:"Mindestens eine Person steht falsch. Rot markiert = Konflikt mit Zeile/Spalte.",
     showErr:"Fehler zeigen",close:"Weiter",who:"Wer ist der Mörder?",whoTxt:"Alle stehen richtig! Wer war allein mit dem Opfer?",
     right:"Fall gelöst! 🎉",rightTxt:(n,t)=>`${n} ist der Mörder. Zeit: ${t}`,wrongM:"Falsch verdächtigt!",wrongMTxt:"Schau nochmal: Der Mörder ist allein mit dem Opfer im selben Raum.",
     back:"Zur Liste",hintTxt:(n,c)=>`${n} steht auf ${c}.`,resetQ:"Fall neu starten?",yes:"Ja",no:"Nein",
     local:"lokal",online:"synchron",
     rules:`<b>So wird gespielt</b><ul>
     <li>In jeder Zeile und jeder Spalte steht genau <b>eine</b> Person.</li>
     <li>Jeder Hinweis beschreibt den Ort einer Person genau.</li>
     <li><b>Neben</b> = direkt links, rechts, oben oder unten – und im selben Raum.</li>
     <li>Gestreifte Felder (Tisch, Pflanze, Regal …) können nicht besetzt werden. Stuhl, Bett, Teppich, Auto … schon.</li>
     <li>Der <b>Mörder</b> war <b>allein mit dem Opfer</b> im selben Raum.</li>
     <li>Person unten antippen → Feld antippen. Nochmal tippen = entfernen. „✕ Markieren“ für Notizen.</li></ul>`},
 tr:{player:"Oyuncu:",undo:"↶ Geri",reset:"Yeni",hint:"💡 İpucu",dim:"Çizgiler",toolPlace:"👤 Kişi",toolX:"✕ İşaretle",check:"✔ Kontrol",
     noLevels:"Henüz vaka yok.",solved:"çözüldü",pickFirst:"Önce aşağıdan bir kişi seç.",cantSit:"Burada kimse duramaz.",
     notFull:"Henüz herkes yerleştirilmedi.",wrong:"Bir şeyler yanlış.",wrongTxt:"En az bir kişi yanlış yerde. Kırmızı = satır/sütun çakışması.",
     showErr:"Hataları göster",close:"Devam",who:"Katil kim?",whoTxt:"Herkes doğru yerde! Kurbanla kim yalnızdı?",
     right:"Vaka çözüldü! 🎉",rightTxt:(n,t)=>`Katil ${n}. Süre: ${t}`,wrongM:"Yanlış şüpheli!",wrongMTxt:"Tekrar bak: Katil, kurbanla aynı odada yalnız olan kişidir.",
     back:"Listeye dön",hintTxt:(n,c)=>`${n}, ${c} karesinde.`,resetQ:"Vaka baştan başlasın mı?",yes:"Evet",no:"Hayır",
     local:"yerel",online:"senkron",
     rules:`<b>Nasıl oynanır</b><ul>
     <li>Her satırda ve her sütunda tam olarak <b>bir</b> kişi bulunur.</li>
     <li>Her ipucu bir kişinin yerini tam olarak tarif eder.</li>
     <li><b>Yanında</b> = hemen solunda, sağında, üstünde veya altında – ve aynı odada.</li>
     <li>Çizgili kareler (masa, bitki, raf …) kullanılamaz. Sandalye, yatak, halı, araba … kullanılabilir.</li>
     <li><b>Katil</b>, aynı odada <b>kurbanla yalnız</b> kalan kişidir.</li>
     <li>Aşağıdan kişiye dokun → kareye dokun. Tekrar dokun = kaldır. Notlar için „✕ İşaretle“.</li></ul>`}
};

/* ===================== STATE ===================== */
let lang = localStorage.getItem("mk_lang") || "de";
let player = localStorage.getItem("mk_name") || "";
let solved = JSON.parse(localStorage.getItem("mk_solved")||"{}");
let L=null, board=null, sel=null, tool="place", hist=[], dimOn=true, showErr=false, tStart=0, tAcc=0, tInt=null;
let db=null, fbOn=false;
const $=id=>document.getElementById(id);
const tt=k=>T[lang][k];
const loc=o=>o?(o[lang]||o.de):"";
const cellName=(r,c)=>String.fromCharCode(65+r)+(c+1);

/* ===================== FIREBASE ===================== */
function fbInit(){
  if(!firebaseConfig.apiKey||!firebaseConfig.databaseURL||typeof firebase==="undefined"){updSync();return;}
  try{
    firebase.initializeApp(firebaseConfig);
    firebase.auth().signInAnonymously().then(()=>{db=firebase.database();fbOn=true;updSync();pullSolved();}).catch(updSync);
  }catch(e){updSync();}
}
const pkey=()=>player.trim().toLowerCase().replace(/[.#$\[\]\/]/g,"_");
function updSync(){$("syncSt").textContent=(fbOn&&player)?"☁️ "+tt("online"):"📱 "+tt("local");}
function pullSolved(){
  if(!fbOn||!player)return;
  db.ref("murdoku/players/"+pkey()+"/solved").once("value").then(s=>{
    const v=s.val()||{}; Object.assign(solved,v); localStorage.setItem("mk_solved",JSON.stringify(solved)); renderHome();
  });
}
function pushSolved(id){
  localStorage.setItem("mk_solved",JSON.stringify(solved));
  if(fbOn&&player) db.ref("murdoku/players/"+pkey()+"/solved/"+id).set(solved[id]);
}

/* ===================== I18N ===================== */
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll(".langs button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=tt(e.dataset.t));
  $("rulesBox").innerHTML=tt("rules");
  updSync();
  if(L){renderGame();} renderHome();
}
document.querySelectorAll(".langs button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;localStorage.setItem("mk_lang",lang);applyLang();});

/* ===================== HOME ===================== */
function renderHome(){
  const box=$("levelList"); box.innerHTML="";
  BOOKS.forEach(bk=>{
    const ls=LEVELS.filter(l=>l.book===bk.id).sort((a,b)=>a.no-b.no);
    const h=document.createElement("div"); h.className="book"; h.textContent=loc(bk); box.appendChild(h);
    if(!ls.length){const e=document.createElement("div");e.className="empty";e.textContent=tt("noLevels");box.appendChild(e);return;}
    ls.forEach(l=>{
      const b=document.createElement("button"); b.className="lvl";
      const s=solved[l.id];
      b.innerHTML=`<div class="n">${l.no}</div><div class="t"><b>${loc(l.title)}</b><small>${l.size}×${l.size} · ${loc(l.diff)}${s?` · ${tt("solved")} ${fmt(s.time)}`:""}</small></div><div class="st">${s?"✅":"🔍"}</div>`;
      b.onclick=()=>openLevel(l.id); box.appendChild(b);
    });
  });
}
$("nameIn").value=player;
$("nameIn").onchange=e=>{player=e.target.value.trim();localStorage.setItem("mk_name",player);updSync();pullSolved();};

/* ===================== GAME ===================== */
function openLevel(id){
  L=LEVELS.find(l=>l.id===id);
  const saved=JSON.parse(localStorage.getItem("mk_b_"+id)||"null");
  board=saved?saved.b:{pos:{},x:{}}; tAcc=saved?saved.t:0;
  hist=[]; sel=null; tool="place"; showErr=false;
  $("home").classList.add("hidden"); $("game").classList.remove("hidden"); $("backBtn").classList.remove("hidden");
  startTimer(); renderGame(); window.scrollTo(0,0);
}
function closeLevel(){
  saveBoard(); stopTimer(); L=null;
  $("game").classList.add("hidden"); $("home").classList.remove("hidden"); $("backBtn").classList.add("hidden");
  $("title").innerHTML='MUR<span>DOKU</span>'; renderHome();
}
$("backBtn").onclick=closeLevel;
function saveBoard(){ if(L) localStorage.setItem("mk_b_"+L.id,JSON.stringify({b:board,t:elapsed()})); }

function objAt(r,c){const o=L.objects.find(o=>o[0]===r&&o[1]===c);return o?o[2]:null;}
function blocked(r,c){const o=objAt(r,c);return o&&OBJ[o]&&!OBJ[o].occ;}
function whoAt(r,c){return Object.keys(board.pos).find(k=>board.pos[k][0]===r&&board.pos[k][1]===c);}
function pColor(id){return COLORS[L.people.findIndex(p=>p.id===id)%COLORS.length];}
function initial(p){return p.name.slice(0,2);}

function renderGame(){
  $("title").textContent=loc(L.title);
  const vic=L.people.find(p=>p.victim);
  $("story").innerHTML=`<b>${vic?vic.name+" †":""}</b> ${loc(L.story)}`;
  const n=L.size, g=$("grid");
  const w=Math.min(window.innerWidth-24,536), cs=Math.floor((w-18)/n);
  g.style.gridTemplateColumns=`18px repeat(${n},${cs}px)`; g.style.setProperty("--cs",cs+"px");
  g.innerHTML="";
  g.appendChild(document.createElement("div"));
  for(let c=0;c<n;c++){const d=document.createElement("div");d.className="lab";d.textContent=c+1;g.appendChild(d);}
  // conflicts
  const rowsUsed={},colsUsed={};
  Object.entries(board.pos).forEach(([k,[r,c]])=>{(rowsUsed[r]=rowsUsed[r]||[]).push(k);(colsUsed[c]=colsUsed[c]||[]).push(k);});
  for(let r=0;r<n;r++){
    const lb=document.createElement("div");lb.className="lab";lb.textContent=String.fromCharCode(65+r);g.appendChild(lb);
    for(let c=0;c<n;c++){
      const d=document.createElement("div"), rm=L.rooms[r][c];
      d.className="cell"; d.style.background=(L.roomNames[rm]||{}).c||"#ddd";
      const B="3px solid var(--line)";
      if(r===0||L.rooms[r-1][c]!==rm)d.style.borderTop=B;
      if(r===n-1||L.rooms[r+1][c]!==rm)d.style.borderBottom=B;
      if(c===0||L.rooms[r][c-1]!==rm)d.style.borderLeft=B;
      if(c===n-1||L.rooms[r][c+1]!==rm)d.style.borderRight=B;
      const o=objAt(r,c);
      if(o){const s=document.createElement("div");s.className="obj";s.textContent=OBJ[o]?OBJ[o].e:"?";d.appendChild(s);if(blocked(r,c))d.classList.add("block");}
      const who=whoAt(r,c);
      if(dimOn&&!who&&(rowsUsed[r]||colsUsed[c]))d.classList.add("dim");
      if(board.x[r+","+c]&&!who){const x=document.createElement("div");x.className="x";x.textContent="✕";d.appendChild(x);}
      if(who){
        const p=L.people.find(p=>p.id===who), t=document.createElement("div");
        t.className="tok"; t.style.background=pColor(who); t.textContent=initial(p);
        if(p.victim)t.style.borderColor="var(--accent)";
        const conflict=rowsUsed[r].length>1||colsUsed[c].length>1;
        const wrong=showErr&&(L.solution[who][0]!==r||L.solution[who][1]!==c);
        if(conflict||wrong)t.classList.add("bad");
        d.appendChild(t);
      }
      d.onclick=()=>tap(r,c);
      g.appendChild(d);
    }
  }
  // tools
  $("toolPlace").classList.toggle("on",tool==="place");
  $("toolX").classList.toggle("on",tool==="x");
  $("dimBtn").classList.toggle("on",dimOn);
  // legend
  const used=[...new Set(L.objects.map(o=>o[2]))];
  $("legend").innerHTML=Object.values(L.roomNames).map(rn=>`<span style="background:${rn.c};color:#222">${loc(rn)}</span>`).join("")+
    used.map(k=>OBJ[k]?`<span class="${OBJ[k].occ?"":"no"}">${OBJ[k].e} ${loc(OBJ[k])}${OBJ[k].occ?"":" ⛔"}</span>`:"").join("");
  // people
  const pp=$("people"); pp.innerHTML="";
  L.people.forEach(p=>{
    const b=document.createElement("button");
    b.className="person"+(p.victim?" victim":"")+(sel===p.id?" on":"")+(board.pos[p.id]?" placed":"");
    b.innerHTML=`<div class="av" style="background:${pColor(p.id)}${p.victim?";border-color:var(--accent)":""}">${initial(p)}</div><div class="tx"><b>${p.name}${board.pos[p.id]?" · "+cellName(...board.pos[p.id]):""}</b>${loc(p)}</div>`;
    b.onclick=()=>{sel=p.id;tool="place";renderGame();};
    pp.appendChild(b);
  });
}

function snapshot(){hist.push(JSON.stringify(board));if(hist.length>200)hist.shift();}
function tap(r,c){
  const who=whoAt(r,c), key=r+","+c;
  if(tool==="x"){ if(who)return; snapshot(); if(board.x[key])delete board.x[key]; else board.x[key]=1; }
  else{
    if(who){snapshot();delete board.pos[who];if(!sel)sel=who;}
    else{
      if(!sel){toast(tt("pickFirst"));return;}
      if(blocked(r,c)){toast(tt("cantSit"));return;}
      snapshot(); board.pos[sel]=[r,c]; delete board.x[key];
      // nächste unplatzierte Person automatisch wählen
      const next=L.people.find(p=>!board.pos[p.id]); sel=next?next.id:null;
    }
  }
  showErr=false; saveBoard(); renderGame();
}
$("toolPlace").onclick=()=>{tool="place";renderGame();};
$("toolX").onclick=()=>{tool="x";renderGame();};
$("dimBtn").onclick=()=>{dimOn=!dimOn;renderGame();};
$("undoBtn").onclick=()=>{if(!hist.length)return;board=JSON.parse(hist.pop());saveBoard();renderGame();};
$("resetBtn").onclick=()=>modal(`<h2>${tt("resetQ")}</h2><button class="btn" id="mY">${tt("yes")}</button><button class="btn sec" id="mN">${tt("no")}</button>`,
  ()=>{$("mY").onclick=()=>{board={pos:{},x:{}};hist=[];tAcc=0;startTimer();hideModal();saveBoard();renderGame();};$("mN").onclick=hideModal;});
$("hintBtn").onclick=()=>{
  // erst falsch platzierte entfernen, dann eine richtige Position setzen
  const wrong=Object.keys(board.pos).filter(k=>board.pos[k][0]!==L.solution[k][0]||board.pos[k][1]!==L.solution[k][1]);
  snapshot();
  if(wrong.length){delete board.pos[wrong[0]];toast("✕ "+L.people.find(p=>p.id===wrong[0]).name);}
  else{
    const p=L.people.find(p=>!board.pos[p.id]); if(!p)return;
    board.pos[p.id]=[...L.solution[p.id]]; toast(tt("hintTxt")(p.name,cellName(...L.solution[p.id])));
  }
  saveBoard();renderGame();
};
$("checkBtn").onclick=()=>{
  if(Object.keys(board.pos).length<L.people.length){toast(tt("notFull"));return;}
  const ok=L.people.every(p=>board.pos[p.id][0]===L.solution[p.id][0]&&board.pos[p.id][1]===L.solution[p.id][1]);
  if(!ok){
    modal(`<h2>${tt("wrong")}</h2><p>${tt("wrongTxt")}</p><button class="btn" id="mE">${tt("showErr")}</button><button class="btn sec" id="mN">${tt("close")}</button>`,
      ()=>{$("mE").onclick=()=>{showErr=true;hideModal();renderGame();};$("mN").onclick=hideModal;});
    return;
  }
  const sus=L.people.filter(p=>!p.victim);
  modal(`<h2>${tt("who")}</h2><p>${tt("whoTxt")}</p><div class="choices">${sus.map(p=>`<button data-p="${p.id}"><span class="av" style="background:${pColor(p.id)}">${initial(p)}</span>${p.name}</button>`).join("")}</div>`,
    ()=>document.querySelectorAll(".choices button").forEach(b=>b.onclick=()=>accuse(b.dataset.p)));
};
function accuse(id){
  if(id===L.murderer){
    stopTimer(); const t=elapsed(); const p=L.people.find(p=>p.id===id);
    const prev=solved[L.id]; if(!prev||t<prev.time){solved[L.id]={time:t,date:new Date().toISOString().slice(0,10)};pushSolved(L.id);}
    modal(`<h2>${tt("right")}</h2><p>${tt("rightTxt")(p.name,fmt(t))}</p><button class="btn" id="mB">${tt("back")}</button><button class="btn sec" id="mN">${tt("close")}</button>`,
      ()=>{$("mB").onclick=()=>{hideModal();closeLevel();};$("mN").onclick=hideModal;});
  }else{
    modal(`<h2>${tt("wrongM")}</h2><p>${tt("wrongMTxt")}</p><button class="btn sec" id="mN">${tt("close")}</button>`,()=>{$("mN").onclick=hideModal;});
  }
}

/* ===================== UI-HELFER ===================== */
function modal(html,bind){$("mbox").innerHTML=html;$("modal").classList.remove("hidden");bind&&bind();}
function hideModal(){$("modal").classList.add("hidden");}
$("modal").onclick=e=>{if(e.target.id==="modal")hideModal();};
let toastT; function toast(m){let d=document.querySelector(".toast");if(!d){d=document.createElement("div");d.className="toast";document.body.appendChild(d);}d.textContent=m;clearTimeout(toastT);toastT=setTimeout(()=>d.remove(),1800);}
function elapsed(){return tAcc+(tStart?Math.floor((Date.now()-tStart)/1000):0);}
function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function startTimer(){stopTimer();tStart=Date.now();tInt=setInterval(()=>$("timer").textContent=fmt(elapsed()),1000);$("timer").textContent=fmt(elapsed());}
function stopTimer(){if(tStart){tAcc=elapsed();tStart=0;}clearInterval(tInt);}
document.addEventListener("visibilitychange",()=>{if(!L)return;if(document.hidden){stopTimer();saveBoard();}else startTimer();});
window.addEventListener("resize",()=>{if(L)renderGame();});

fbInit(); applyLang();
</script>
