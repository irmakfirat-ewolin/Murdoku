<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Murdoku">
<meta name="theme-color" content="#120b22">
<title>Murdoku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Baloo+2:wght@400;500;600;700;800&family=Bungee&family=Kalam:wght@400;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#120b22;--bg2:#1b1233;--panel:#1d1538;--panel2:#271d4a;--line:#3d2f72;--ink:#f4efff;--soft:#a99bd6;
 --lav:#b69cff;--pink:#ff2d6f;--yel:#ffe14d;--cyan:#4dd2ff;--green:#3ef07a;--orange:#ffa31a;--wall:#14101e;--case:#b69cff}
*{touch-action:manipulation;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;margin:0;color:var(--ink);font-family:"Baloo 2",system-ui,sans-serif;
 background:radial-gradient(120% 60% at 50% 0%,#2a1856 0%,var(--bg) 60%) fixed,var(--bg);min-height:100%}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.hidden{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 40px}

/* Kopf */
.top{display:flex;align-items:center;gap:10px;padding:12px 14px 6px;max-width:560px;margin:0 auto}
.top .back{font-size:24px;color:var(--case,#ff5ec8)!important;box-shadow:0 0 10px color-mix(in srgb,var(--case,#ff5ec8) 45%,transparent);width:44px;height:44px;border-radius:14px;background:var(--panel2);border:1.5px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.brand{flex:1;font-weight:700;font-size:24px;color:var(--lav);text-shadow:0 0 14px #b69cff99}
.langs{display:flex;background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:3px}
.langs button{padding:5px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--soft)}
.langs button.on{background:var(--lav);color:#1a1033;box-shadow:0 0 12px #b69cffaa}

/* Titel */
.logo{text-align:center;margin:18px 0 6px}
.logo h1{margin:0;font-family:"Bungee",Impact,sans-serif;font-weight:400;font-size:clamp(46px,14vw,72px);letter-spacing:2px;line-height:1;color:#fff;position:relative;display:inline-block;
 text-shadow:0 0 6px #fff,0 0 18px #ff4fd8,0 0 38px #b69cff,0 0 60px #7a3cff}
.logo h1 .d{position:relative}
.logo h1 .d::after{content:"";position:absolute;left:46%;top:2px;width:7px;height:26px;background:#e3122f;border-radius:0 0 6px 6px;box-shadow:0 0 10px #ff1f3d}
.logo h1 .d.k::after{left:58%;height:18px}
.pillT{display:inline-block;margin-top:12px;background:#fff;color:#1a1033;border-radius:999px;padding:7px 18px;font-weight:600;font-size:clamp(13px,3.6vw,16px);box-shadow:0 0 18px #ff4fd855}
.pillT b{color:#e3122f}
.player{display:flex;gap:8px;align-items:center;margin:16px 0 4px;font-size:14px;color:var(--soft);background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:10px 12px}
.player input{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;font:inherit;background:var(--bg);color:var(--ink)}
.sync{font-size:12px;color:var(--soft)}
.book{margin:22px 0 10px;font-size:22px;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--lav);text-shadow:0 0 12px #b69cff88;flex-wrap:wrap}
.book small{font-weight:500;color:var(--soft);font-size:13px;text-shadow:none;flex-basis:100%;order:3;margin-top:-4px}
.book .rb{margin-left:auto;font-size:14px;color:var(--ink);background:var(--panel2);border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;text-shadow:none}
.search{display:flex;align-items:center;gap:8px;margin:12px 0 4px;background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:8px 12px;color:var(--soft)}
.search input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:6px 2px}
.search input::-webkit-search-cancel-button{display:none}
.search button{background:none;border:0;color:var(--soft);font-size:16px;padding:4px 6px}
.cases{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.case{min-height:84px;background:var(--panel);border:2px solid var(--cc);border-radius:20px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:10px 12px;text-align:left;color:var(--ink);box-shadow:0 0 12px color-mix(in srgb,var(--cc) 40%,transparent),inset 0 0 14px color-mix(in srgb,var(--cc) 14%,transparent)}
.case .cn{font-size:13px;font-weight:700;color:var(--cc)}
.case .ct{font-size:17px;font-weight:600;line-height:1.15;overflow-wrap:anywhere;hyphens:auto}
.case .ck{font-size:12px;color:var(--green);font-weight:600}
.case.done{background:linear-gradient(160deg,#1f3a2c,var(--panel) 60%)}
.empty{color:var(--soft);font-size:14px}

/* Fall */
.caseNav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 0}
.caseNav button{width:48px;height:48px;border-radius:16px;background:var(--panel);border:2px solid var(--case);color:var(--case);font-size:30px;line-height:1;font-weight:700;box-shadow:0 0 12px color-mix(in srgb,var(--case) 45%,transparent)}
.caseNav button:disabled{opacity:.25;box-shadow:none}
.caseNav span{color:var(--soft);font-weight:600;font-size:14px}
.caseHead{text-align:center;margin:6px 0 14px}
.caseHead h1{margin:0;font-size:30px;color:var(--case);text-shadow:0 0 16px var(--case)}
.caseHead p{margin:6px 0 0;font-size:15px;color:var(--soft)}
.suspects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0 14px}
.sus{display:flex;flex-direction:row;align-items:flex-start;gap:8px;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-left:5px solid var(--pc,#888);border-radius:14px;padding:7px 7px 7px 6px;transition:box-shadow .15s,background .15s;min-width:0}
.pol{position:relative;flex:0 0 52px;width:52px;background:#fff;padding:3px;border:1.5px solid #333;box-shadow:0 2px 5px #0008;color:#1a1520}
.pol svg{display:block;width:100%;aspect-ratio:1;border:1px solid #333}
.gb{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;font:800 11px/18px "Baloo 2",sans-serif;text-align:center;color:#fff;border:1.5px solid #fff;box-shadow:0 1px 3px #0008;z-index:2}.gb.m{background:#2f6fd6}.gb.f{background:#d6337a}
.stxt{flex:1;min-width:0}
.stxt .nm{font-family:"Dancing Script",cursive;font-size:20px;font-weight:700;line-height:1.05;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stxt .nm .lt{font-family:"Baloo 2",sans-serif;font-size:17px;font-weight:800;color:var(--pc);margin-right:5px}
.sus.victim .stxt .nm .lt{color:#e7aab6}
.clue{overflow-wrap:break-word;font-size:13px;line-height:1.25;color:#e9e3ff;margin-top:3px}
.clue b{font-weight:700;color:var(--yel)}
.sus.victim{background:#3a1d33}
.sus.on{background:#ff2d6f22;box-shadow:0 0 0 2.5px var(--pink),0 0 18px #ff2d6f88}
.sus.placed{opacity:.5}
.stickB{position:sticky;top:0;z-index:20;margin:8px -14px 0;padding:4px 14px 6px;background:var(--bg);box-shadow:0 8px 14px -8px #000c}
#game{padding-bottom:90px}
#game .tools{position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0;padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);background:#120b22ee;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1.5px solid var(--line);max-width:560px;margin:0 auto}
#game .tools button{padding:10px 4px}
@media (max-width:360px){.suspects{grid-template-columns:1fr}}

.bwrap{position:relative;margin:0 auto;touch-action:manipulation;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.board{touch-action:pan-x pan-y;position:absolute;border:5px solid var(--wall);background:var(--wall);touch-action:manipulation;border-radius:4px;box-shadow:0 0 0 2px var(--case),0 0 26px var(--case),0 0 60px #7a3cff55}
.cell{touch-action:pan-x pan-y;position:absolute;outline:1px solid rgba(30,30,40,.55);outline-offset:-0.5px}
.wall{position:absolute;background:var(--wall);z-index:3;pointer-events:none}
.ov{position:absolute;pointer-events:none;z-index:2}
.win{position:absolute;z-index:5;pointer-events:none}
.rlab{position:absolute;z-index:6;transform:translate(-50%,0);background:#fbf8ef;color:#1b1a20;border:2px solid var(--wall);border-radius:999px;padding:1px 9px;font-family:"Zilla Slab",Georgia,serif;font-weight:700;text-transform:uppercase;white-space:nowrap;pointer-events:none;letter-spacing:.2px}
.mark{position:absolute;z-index:7;display:grid;place-items:center;pointer-events:none}
.mark .tok{width:72%;height:72%;border-radius:50%;background:#fff;color:#1b1a20;border:2.5px solid var(--wall);display:grid;place-items:center;font-family:"Kalam",cursive;font-weight:700;line-height:1}
.mark .tok.vic{background:#e7b9c4}
.mark .tok.bad{border-color:#d22;box-shadow:0 0 0 3px #f66}
.mark svg{width:70%;height:70%}
.mark.auto svg{opacity:1}
.notes{position:absolute;z-index:7;pointer-events:none}
.notes span{position:absolute;width:38%;height:38%;display:grid;place-items:center;border-radius:50%;background:#fffd;color:#1b1a20;border:1.5px solid var(--wall);font-family:"Kalam",cursive;font-weight:700;line-height:1}
.notes span.vic{background:#f1c9d2}
.axl{position:absolute;display:grid;place-items:center;font-size:12px;color:var(--soft);font-weight:600}
.cmp{position:absolute;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--lav);font-size:15px;font-weight:700;text-shadow:0 0 8px #b69cff}
.cmp i{display:block;background:#6a58a8}
.infos{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:0 0 16px}
.info{background:#cdc6ea;color:#1b1a20;border-radius:18px;padding:10px 14px;text-align:center;max-width:250px;box-shadow:0 4px 0 #0005;font-family:"Zilla Slab",Georgia,serif}
.info b{display:block;font-size:19px;line-height:1.1}
.info span{display:block;font-size:14px;line-height:1.25;margin:4px 0 6px}
.info svg{display:block;margin:0 auto}
.gen{display:flex;align-items:center;gap:10px;background:#cdc6ea;color:#1b1a20;border-radius:16px;padding:9px 14px;margin:0 auto 14px;max-width:340px;font-family:"Zilla Slab",Georgia,serif;font-size:15px;box-shadow:0 3px 0 #0005}
.gen i{font-style:normal;font-size:22px}
.zoomBtn{display:block;width:100%;margin:2px 0 8px;background:var(--panel);border:2px solid var(--cyan);color:var(--cyan);border-radius:18px;padding:11px;font-weight:700;font-size:15px;box-shadow:0 0 12px #4dd2ff44}
#zoomOv{position:fixed;inset:0;z-index:70;background:#07040f;display:flex;flex-direction:column;touch-action:none}
#zoomOv .zbar{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px}
#zoomOv .zbar span{flex:1;color:var(--soft);font-size:13px}
#zoomOv .zbar button{width:44px;height:44px;border-radius:14px;background:var(--panel2);border:1.5px solid var(--line);color:var(--ink);font-size:20px;font-weight:700}
#zoomOv .zbar #zClose{background:var(--pink);border-color:var(--pink)}
#zoomOv .zarea{flex:1;position:relative;overflow:hidden;touch-action:none}
#zoomOv .zin{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.howto{text-align:center;font-size:13px;color:var(--soft);margin:2px 0 8px}

.tools{display:flex;gap:8px;margin:16px 0 8px}
.tools button{flex:1;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:12px 4px;font-weight:700;font-size:15px}
.tools button.on{background:var(--lav);border-color:var(--lav);color:#1a1033;box-shadow:0 0 16px #b69cffaa}
#checkBtn{border-color:var(--green);color:var(--green);box-shadow:0 0 12px #3ef07a44}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bar button{background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:6px 10px;font-size:13.5px;font-weight:600}
.bar button.on{background:var(--lav);color:#1a1033}
#hintBtn{border-color:var(--yel);color:var(--yel)}
#solBtn{border-color:var(--pink);color:#ff7aa4}
.timer{margin-left:auto;font-weight:700;color:var(--cyan);text-shadow:0 0 10px #4dd2ff;font-variant-numeric:tabular-nums}

.verdict{margin:22px auto 0;width:82%;background:#efe9dc;color:#1b1a20;padding:14px 16px 18px;box-shadow:0 0 22px #ff2d6f55;transform:rotate(-1deg);clip-path:polygon(0 0,100% 0,100% 100%,62% 100%,60% 94%,57% 100%,0 100%);text-align:left;display:block;font-family:"Zilla Slab",Georgia,serif}
.verdict .l{font-size:15px}
.verdict .v{border-bottom:2px solid #333;min-height:30px;margin-top:6px;font-family:"Dancing Script",cursive;font-size:26px;text-align:center}

/* Modal */
.modal{overscroll-behavior:contain;touch-action:none;position:fixed;inset:0;background:#07040fcc;display:grid;place-items:center;z-index:50;padding:16px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.box{overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;background:var(--panel);border:2px solid var(--lav);border-radius:26px;padding:20px;max-width:420px;width:100%;max-height:86vh;overflow:auto;text-align:center;box-shadow:0 0 30px #b69cff55;color:var(--ink)}
.box h2{margin:0 0 10px;color:var(--lav);text-shadow:0 0 12px #b69cff88}
.box p{margin:0 0 14px;color:var(--soft)}
.box.rules{text-align:left}
.box.wide{max-width:540px;padding:16px 12px}
.box.rules h3{margin:14px 0 4px;color:var(--yel)}
.box.rules ul{margin:0;padding-left:18px;line-height:1.45;font-size:15px}
.box.rules b{color:var(--cyan)}
.objs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.objs div{background:#fff;color:#1b1a20;border-radius:12px;padding:4px;text-align:center;font-size:12px;width:66px}
.objs svg{width:44px;height:44px;display:block;margin:0 auto}
.objs.ok div{background:#c9f2cf}.objs.no div{background:#ffc9d4}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px}
.choices button{background:#fff;color:#1b1a20;border-radius:14px;padding:6px 4px;font-family:"Dancing Script",cursive;font-size:20px;font-weight:700}
.choices svg{width:52px;height:52px;display:block;margin:0 auto 2px;border:1.5px solid #333}
.btn{background:var(--lav);color:#1a1033;border-radius:14px;padding:11px 18px;font-weight:700;margin:4px;box-shadow:0 0 14px #b69cff88}
.btn.sec{background:var(--panel2);color:var(--ink);box-shadow:none;border:1.5px solid var(--line)}
.badge{display:inline-grid;place-items:center;width:1.45em;height:1.45em;border-radius:50%;color:#fff;font-weight:700;font-family:"Zilla Slab",serif;font-size:.95em;vertical-align:-.25em;margin:0 1px;box-shadow:inset 0 -2px 0 #0003,0 0 8px #fff3}
.badge.vic{color:#3a1a20}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--panel2);border:1.5px solid var(--lav);color:#fff;padding:11px 18px;border-radius:16px;font-size:14px;z-index:60;max-width:90vw;text-align:center;box-shadow:0 0 18px #b69cff66}
</style>
</head>
<body>

<div class="top">
  <button class="back hidden" id="backBtn" aria-label="Home"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 L12 3.5 L21 11"/><path d="M5.5 9.2 V20 H10 V14.5 H14 V20 H18.5 V9.2"/></svg></button>
  <div class="brand" id="brand"></div>
  <div class="langs"><button data-l="de">DE</button><button data-l="tr">TR</button></div>
</div>

<div id="home" class="wrap">
  <div class="logo">
    <h1>MU<span class="d">R</span>DO<span class="d k">K</span>U</h1><br>
    <div class="pillT" id="pillT"></div>
  </div>
  <div class="player"><span data-t="player"></span><input id="nameIn" placeholder="Fırat" autocomplete="off"><span class="sync" id="syncSt"></span></div>
  <div class="search"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 L21 21"/></svg><input id="searchIn" type="search" autocomplete="off"><button id="searchX" class="hidden">✕</button></div>
  <div id="bookList"></div>
</div>

<div id="game" class="wrap hidden">
  <div class="caseNav"><button id="prevBtn">‹</button><span id="navNo"></span><button id="nextBtn">›</button></div>
  <div class="caseHead"><h1 id="cTitle"></h1><p id="cIntro"></p></div>
  <div class="bar">
    <button id="undoBtn" data-t="undo"></button>
    <button id="resetBtn" data-t="reset"></button>
    <button id="hintBtn" data-t="hint"></button>
    <button id="solBtn" data-t="sol"></button>
    <button id="rulesBtn" data-t="rules"></button>
    <span class="timer" id="timer">0:00</span>
  </div>
  <div class="stickB" id="stickB"><div class="bwrap" id="board"></div></div>
  <div class="howto" id="howto"></div>
  <div class="suspects" id="suspects"></div>
  <div id="general"></div>
  <button class="zoomBtn" id="zoomBtn" data-t="zoom"></button>
  <button class="verdict" id="verdict"><div class="l" data-t="verdict"></div><div class="v" id="verdictName"></div></button>
  <div class="tools">
    <button id="toolPlace" data-t="toolPlace"></button>
    <button id="toolX" data-t="toolX"></button>
    <button id="checkBtn" data-t="check"></button>
  </div>
  <div class="infos" id="infos" style="margin-top:26px"></div>
</div>

<div id="modal" class="modal hidden"><div class="box" id="mbox"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ============ FIREBASE (wie Chimera/Haushalt, Projekt "schulwegend") ============
   Leer lassen = Fortschritt nur lokal im Browser. */
const firebaseConfig = {
  apiKey: "",
  authDomain: "schulwegend.firebaseapp.com",
  databaseURL: "",
  projectId: "schulwegend",
  appId: ""
};

/* ============ SYMBOLE (SVG, Draufsicht) ============ */
const OL="#2b2a33";
const SVG={
 table:`<svg viewBox="0 0 100 100"><rect x="12" y="10" width="76" height="66" rx="3" fill="#aeb8c8" stroke="${OL}" stroke-width="4"/><rect x="12" y="62" width="76" height="14" fill="#5c6474" stroke="${OL}" stroke-width="4"/><rect x="20" y="76" width="9" height="14" fill="#5c6474" stroke="${OL}" stroke-width="3"/><rect x="71" y="76" width="9" height="14" fill="#5c6474" stroke="${OL}" stroke-width="3"/></svg>`,
 plant:`<svg viewBox="0 0 100 100"><ellipse cx="52" cy="84" rx="26" ry="10" fill="#33313b"/><path d="M30 58 L70 58 L64 86 L36 86 Z" fill="#6c8fc6" stroke="${OL}" stroke-width="4" stroke-linejoin="round"/><ellipse cx="50" cy="58" rx="20" ry="5" fill="#4f6fa3" stroke="${OL}" stroke-width="3"/><g fill="#5fae4f" stroke="#2f5d2a" stroke-width="3" stroke-linejoin="round"><path d="M50 58 C40 40 22 30 12 34 C26 38 38 48 46 60Z"/><path d="M50 58 C58 38 76 26 90 30 C76 36 62 48 54 60Z"/><path d="M50 58 C46 36 40 18 32 8 C44 18 52 36 54 58Z"/><path d="M50 58 C56 36 62 22 72 12 C64 26 58 42 54 60Z"/><path d="M50 58 C36 52 24 54 14 62 C28 58 40 60 48 62Z"/><path d="M50 58 C64 52 78 54 88 62 C74 58 62 60 52 62Z"/></g></svg>`,

function polyGeom(cells){
  const r0=Math.min(...cells.map(c=>c[0])),c0=Math.min(...cells.map(c=>c[1]));
  const R=Math.max(...cells.map(c=>c[0]))-r0+1,C=Math.max(...cells.map(c=>c[1]))-c0+1;
  const has=(r,c)=>cells.some(x=>x[0]===r&&x[1]===c);
  const sq=cells.map(([r,c])=>`M${(c-c0)*100} ${(r-r0)*100}h100v100h-100z`).join("");
  const seg=[],bottom=[];
  cells.forEach(([r,c])=>{const x=(c-c0)*100,y=(r-r0)*100;
    if(!has(r-1,c))seg.push(`M${x} ${y}h100`);
    if(!has(r+1,c)){seg.push(`M${x} ${y+100}h100`);bottom.push([x,y+100,r,c]);}
    if(!has(r,c-1))seg.push(`M${x} ${y}v100`);

  rules:{
   de:`<h3>Ziel</h3><ul><li>Finde heraus, wer der Mörder ist: die Person, die im selben Raum wie das Opfer war.</li></ul>
   <h3>Regeln</h3><ul><li>Jede Person befindet sich in einer anderen Zeile und Spalte.</li>
   <li>Nur Betten, Stühle und Teppiche können besetzt werden. Tische, Fernseher, Pflanzen, Regale und Kisten nicht.</li>
   <li>Das Opfer ist im letzten freien Feld. Wer allein mit ihm im selben Raum war, ist der Mörder.</li></ul>
   <h3>Begriffe</h3><ul>
   <li><b>neben</b>: direkt darüber, darunter, links oder rechts – und im selben Raum.</li>
   <li><b>vor einem Fenster</b>: auf einem Feld direkt neben dem Fenster. Fenster liegen auf dicken Linien (Rand oder zwischen zwei Feldern).</li>
   <li><b>allein</b>: niemand sonst im Raum (auch nicht das Opfer). <b>allein mit (b)</b>: nur diese zwei im Raum. <b>leer</b>: niemand im Raum.</li>
   <li><b>Ecke</b>: wo zwei Wände eines Raumes zusammentreffen.</li>
   <li><b>westlich / östlich von</b>: links / rechts von jemandem, nicht unbedingt im selben Raum.</li>
   <li><b>die einzige Person auf einem Stuhl</b>: niemand sonst auf einem Stuhl, auch nicht das Opfer (gilt genauso für Teppich, Tisch …).</li>
   <li><b>Raum</b>: jeder umschlossene Bereich, auch Durchgänge.</li></ul>`,
   tr:`<h3>Amaç</h3><ul><li>Katili bul: kurbanla aynı odada olan kişi.</li></ul>
   <h3>Kurallar</h3><ul><li>Her kişi farklı bir satırda ve farklı bir sütunda bulunur.</li>
   <li>Sadece yataklar, sandalyeler ve halılar kullanılabilir. Masa, televizyon, bitki, raf ve kutuların olduğu karelere kimse konamaz.</li>
   <li>Kurban son boş karededir. Onunla aynı odada yalnız kalan kişi katildir.</li></ul>
   <h3>Terimler</h3><ul>
   <li><b>yanında</b>: hemen üstünde, altında, solunda veya sağında – ve aynı odada.</li>
   <li><b>pencerenin önünde</b>: pencereye doğrudan bitişik karede. Pencereler kalın çizgiler üzerindedir (kenarda veya iki kare arasında).</li>
   <li><b>yalnız</b>: odada başka kimse yok (kurban da yok). <b>(b) ile yalnız</b>: odada sadece bu ikisi var. <b>boş</b>: odada kimse yok.</li>
   <li><b>köşe</b>: odanın iki duvarının birleştiği yer.</li>
   <li><b>batısında / doğusunda</b>: birinin solunda / sağında, aynı odada olması gerekmez.</li>
   <li><b>sandalyedeki tek kişi</b>: başka kimse sandalyede değil, kurban da (halı, masa … için de aynı).</li>
   <li><b>oda</b>: duvarlarla çevrili her alan, geçitler de dahil.</li></ul>`}},

 steps:{
  de:["Nur **H** kann auf einem Teppich sein, und nur **E** kann auf einem Stuhl sitzen.",
      "**B** ist in Z1, aber nicht auf dem Stuhl und nicht im Flur (wo **F** und **C** allein sind), also ist sie in der Küche. Schließe die anderen Felder in Z1 aus.",
      "**F** und **C** sind nicht auf einem Stuhl oder Teppich im Flur. Das lokalisiert **F** im einzigen verbleibenden Feld im Flur neben einer Pflanze.",
      "Da kein Raum leer ist, ist jemand im Aufzug in Z5. Das lokalisiert **G** (der nicht auf einem Stuhl ist) im Gemeinschaftsraum.",
      "Es gibt nur ein Feld in S8, was **C** lokalisiert. Der Rest des Flurs ist leer.",
      "Das lokalisiert **H** auf dem letzten Teppichfeld. Das lokalisiert **B**, dann **E** auf dem letzten Stuhl. Das einzige verfügbare Feld in S6 ist im Empfang; **A**, in einem Raum mit Fernseher, muss dort sein.",
      "Das lokalisiert **D** und **O**. Berta ist die Mörderin!"],
  tr:["Halıda sadece **H**, sandalyede sadece **E** olabilir.",
      "**B** Z1'de ama sandalyede değil ve koridorda değil (orada **F** ve **C** yalnız); bu yüzden mutfakta. Z1'deki diğer kareleri ele.",
      "**F** ve **C** koridorda sandalyede ya da halıda değil. Bu, **F**'yi koridorda bitkinin yanındaki kalan tek karede bulur.",

 steps:{
  de:["**H** ist im Wohnzimmer (laut **B**s Hinweis) und mit einer Frau genau zwei Zeilen über ihm und eine Spalte links von ihm. Das kann nur **A** sein.",
      "**A** könnte in Z3 S8 oder Z4 S7 sein, aber da **D** in Z4 ist, lokalisiert das **A** und **H**. Schließe alle anderen Felder neben Regalen aus.",
      "Jemand muss in Z1 S4 sein; das kann nur **B** sein.",
      "Jemand muss in Z6 S5 sein (entweder **G** oder **O**). Das lokalisiert **C** und **D** im Esszimmer.",
      "Das lokalisiert **F** im letzten Feld neben einer Pflanze.",
      "**G** ist nicht im Gästezimmer (da **E** in S3 ist) und muss im Arbeitszimmer sein, in Z6 S5. Das blockiert Z7 S6, was **E** im letzten Feld in Z7 lokalisiert.",
      "Das lokalisiert **O**. Felicity ist die Mörderin!"],
  tr:["**H** oturma odasında (**B**'nin ipucuna göre) ve tam iki satır yukarısında ve bir sütun solunda bir kadın var. Bu sadece **A** olabilir.",
      "**A**, Z3 S8'de ya da Z4 S7'de olabilir; ama **D** Z4'te olduğu için bu, **A**'yı ve **H**'yi bulur. Raf yanındaki diğer bütün kareleri ele.",
      "Z1 S4'te biri olmalı; bu sadece **B** olabilir.",
      "Z6 S5'te biri olmalı (**G** ya da **O**). Bu, **C**'yi ve **D**'yi yemek odasında bulur.",
      "Bu, **F**'yi bir bitkinin yanındaki son karede bulur.",
      "**G** misafir odasında değil (**E** S3'te olduğu için), çalışma odasında Z6 S5'te olmalı. Bu, Z7 S6'yı kapatır; bu da **E**'yi Z7'deki son karede bulur.",
      "Bu, **O**'yu bulur. Katil Felicity!"]
 },

  tr:["Yatak mağazası yataklı tek oda; bu yüzden **A** orada ve oradaki herkes bir yatağın üstünde. Yatak olmayan kareleri ele.",
      "Bu, **C**'yi Z2 S3'te, S3'teki son karede bulur. **C** yalnızdı; ofisteki diğer kareleri ele.",
      "Bu, **D**'nin ipucuna göre halıda olamayacak **B**'yi bulur.",
      "**A**, **E** ve **F** yataklarda olmalı ve Z5'te değil (orada **G** var). En kuzeyde **E**, sonra **A**, sonra **F**. Bu, **E**'yi Z4 S2'de, sonra **A** ve **F**'yi bulur.",
      "Bu, **G**'yi bulur ve **D**'yi Z8'deki halıya koyar. **H** depoda olmalı ve sadece Z3 S8'de olabilir. Bu, **D**'yi ve **O**'yu bulur. Katil Howard!"]

 steps:{

      "**A** (der laut **G**s Hinweis nicht im Tankbereich ist) ist entweder in der Werkstatt oder auf dem Parkplatz hinten in einem der beiden Autos in diesen Bereichen. Schließe die sich überschneidenden Felder bei Z1 S5 und Z5 S9 aus. Das lokalisiert **E** im Keller.",

      "Das lässt eine verfügbare Öllache, die laut dem allgemeinen Hinweis besetzt sein muss. Das lokalisiert **H** auf dem Parkplatz.",
      "Das lokalisiert **G** im letzten Auto.",

 steps:{
  de:["Jedes Schlafzimmer hat eine unterschiedliche Anzahl an Personen. Da **A** allein in einem ist, haben die anderen Schlafzimmer null und drei Personen.",
      "**B**, auf einem Bett, ist einer der Dreiergruppe. Er ist nicht auf dem Bett in S1 in Schlafzimmer 1 (da jemand laut **G**s Hinweis am Fenster in S1 ist), also ist er nicht mit **C** oder **D**, und kann nur mit **E** und **H** sein. Sie müssen in Schlafzimmer 3 sein (**H** wäre in Schlafzimmer 2 gezwungen, neben einer Wand zu sein). Das lokalisiert **H**, **B** und **E**.",
      "**D** und **G** sind im Flur, also muss **O** in der Toilette mit **C** oder **F** sein.",
      "Nur **D** kann am Fenster sein, was ihn in Z7 S1 lokalisiert. Das Eliminieren aller anderen Teppichfelder lässt ein verfügbares Feld in Z5: den Stuhl, auf dem **C** sein muss.",
      "**F** muss neben dem Tisch in der Toilette mit **O** in Z9 S4 sein. Das lokalisiert **A** in Schlafzimmer 2, dann **G**. Fletcher ist der Mörder!"],
  tr:["Her yatak odasında farklı sayıda kişi var. **A** birinde yalnız olduğundan diğer yatak odalarında sıfır ve üç kişi var.",
      "Yataktaki **B** üçlü gruptan biri. Yatak odası 1'de S1'deki yatakta değil (**G**'nin ipucuna göre S1'de pencere önünde biri var), o halde **C** ya da **D** ile değil; ancak **E** ve **H** ile olabilir. Yatak odası 3'te olmalılar (Yatak odası 2'de **H** duvarın yanında kalmak zorunda kalırdı). Bu, **H**'yi, **B**'yi ve **E**'yi bulur.",
      "**D** ve **G** koridorda; o halde **O**, tuvalette **C** ya da **F** ile olmalı.",
      "Pencere önünde yalnızca **D** olabilir; bu onu Z7 S1'de bulur. Diğer tüm halı karelerini elemek Z5'te tek boş kare bırakır: **C**'nin olması gereken sandalye.",
      "**F**, tuvaletteki masanın yanında, **O** ile birlikte; **O** Z9 S4'te. Bu, **A**'yı Yatak odası 2'de, sonra **G**'yi bulur. Katil Fletcher!"]
 },
 murderer:"fletcher"
},

 steps:{
  de:["**B** muss in Z8 oder Z9 sein, und ebenso **A**, da **D** in S5 ist. Schließe alle Felder in Z8 und Z9 aus, die nicht neben dem Küchentisch oder einem Regal sind (oder in S5 sind).",
      "Eines der Betten ist besetzt, also kann der Stuhl im Schlafzimmer ausgeschlossen werden.",
      "Die einzigen verbleibenden Stühle für **G** und die Frau auf einem Stuhl sind in Z5 und Z6, mit einem im Esszimmer, dem anderen im Wohnzimmer. Keiner kann in S5 sitzen (**D**s Spalte), was nur den Stuhl in Z6 S6 im Wohnzimmer lässt, was wiederum nur Z5 S2 im Esszimmer lässt. Schließe diese Zeilen und Spalten aus.",
      "Das lokalisiert **F** (allein im Badezimmer) und **A**, dann **B**.",
      "**C** muss im letzten Feld in S3 sein.",
      "Das lokalisiert **D**, was bedeutet, dass **E** nicht auf dem Wohnzimmerstuhl ist, also ist das **G**. Die letzten beiden Felder sind Z1 S8 und Z3 S9, im Schlafzimmer. **E**, allein, muss auf dem Esszimmerstuhl sein. **H** ist neben der Pflanze; **O** ist im verbleibenden Feld. Heidi ist die Mörderin!"],
  tr:["**D** S5'te olduğundan **B** Z8 ya da Z9'da olmalı, **A** da öyle. Z8 ve Z9'da mutfak masasının ya da bir rafın yanında olmayan (veya S5'teki) tüm kareleri ele.",
      "Yataklardan biri dolu, o halde yatak odasındaki sandalye elenebilir.",
      "**G** ve sandalyedeki kadın için kalan sandalyeler Z5 ve Z6'da: biri yemek odasında, diğeri oturma odasında. Hiçbiri S5'te (**D**'nin sütunu) oturamaz; bu yalnızca oturma odasında Z6 S6'daki sandalyeyi, o da yemek odasında yalnızca Z5 S2'yi bırakır. Bu satırları ve sütunları ele.",
      "Bu, **F**'yi (banyoda yalnız) ve **A**'yı, sonra **B**'yi bulur.",
      "**C**, S3'teki son karede olmalı.",
      "Bu, **D**'yi bulur; yani oturma odası sandalyesinde **E** değil **G** var. Son iki kare yatak odasında Z1 S8 ve Z3 S9. Yalnız olan **E** yemek odası sandalyesinde olmalı. **H** bitkinin yanında; **O** kalan karede. Katil Heidi!"]
 },

      "**D**, **B** und **E** besetzen Z6/Z7/Z8.",
      "Alle verbleibenden Felder neben einem Tisch enthalten einen Stuhl, also sitzt **A** auf einem Stuhl und niemand sonst. Das lokalisiert **H**, dann **E**, dann **D**, dann **B**.",
      "Z1 S2 ist das letzte Feld in Z1, also muss es besetzt sein (entweder von **G** oder **O**). Das lokalisiert **F**. **A** kann jetzt in Z2 S5 oder Z9 S4 sein; wir können die beiden sich überschneidenden Felder ausschließen. Das lässt nur ein verfügbares Feld in S5: den Stuhl, den **A** besetzen muss.",
      "**C** kann nur in Z5 S4 sein. Das lokalisiert **G** in Z1 S2, dann **O** in der unteren rechten Ecke. Flora ist die Mörderin!"],
  tr:["**H** ve **E** (hangi sırayla olursa olsun) S7 ve S8'de; hiçbir oda boş olmadığından farklı odalarda olmalılar. **H**, **E**'nin kuzeyinde; o halde **H** misafir odasında, **E** yatak odasında.",
      "**B** mutfakta, **G** oturma odasında ve ormanda en az iki kişi var (S1 ve S9'da); o halde **D** ancak banyoda yalnız olabilir.",
      "**D**, **B** ve **E**, Z6/Z7/Z8'i doldurur.",
      "Bir masanın yanındaki kalan tüm karelerde sandalye var; o halde **A** bir sandalyede oturuyor, başka kimse oturmuyor. Bu, **H**'yi, sonra **E**'yi, sonra **D**'yi, sonra **B**'yi bulur.",
      "Z1 S2, Z1'deki son kare; dolu olmalı (ya **G** ya **O**). Bu, **F**'yi bulur. **A** artık Z2 S5'te ya da Z9 S4'te olabilir; kesişen iki kareyi ele. Bu, S5'te tek boş kare bırakır: **A**'nın oturması gereken sandalye.",
      "**C** ancak Z5 S4'te olabilir. Bu, **G**'yi Z1 S2'de, sonra **O**'yu sağ alt köşede bulur. Katil Flora!"]

 steps:{
  de:["**B** und **D** müssen in separaten Räumen sein; einer ist im Eingang und der andere im Flur. **A** ist bei den Kassen, neben dem Tisch.",
      "**C**, auf einem Teppich, kann nicht mit **D** sein (die alleine ist) oder mit **B** (da **C** mit einer Frau ist und nur zwei Leute in **B**s Raum sein können). Sie muss bei den Kassen mit **A** sein oder im Vorführraum mit **G**.",
      "Zusammen besetzen **A**, **C** und **G** die letzten drei Zeilen, also können wir die unterste Zeile von Saal B ausschließen.",
      "**F** muss in Saal A sein, in Z4. Das platziert **H** in Z1, was das Fenster in Z1 blockiert und **D** im Eingang lokalisiert und **B** im Flur. Das lokalisiert **F**.",
      "Jemand muss in Z8 S7 sein; das kann nur **G** sein. Das lokalisiert **H** und blockiert auch den Teppich im Vorführraum, was **C** in S5 platziert, was **B** lokalisiert.",
      "Das lokalisiert **A**, dann **C**, dann **E** im letzten Feld ohne Stuhl, dann **O**. Fred ist der Mörder!"],
  tr:["**B** ve **D** ayrı odalarda olmalı; biri girişte, diğeri koridorda. **A** kasaların yanında, masanın yanında.",
      "Halıdaki **C**, **D** ile (o yalnız) ya da **B** ile olamaz (**C** bir kadınla birlikte ve **B**'nin odasında yalnızca iki kişi olabilir). **A** ile gişede ya da **G** ile makine dairesinde olmalı.",
      "**A**, **C** ve **G** birlikte son üç satırı doldurur; o halde Salon B'nin en alt satırını eleyebiliriz.",
      "**F**, Salon A'da, Z4'te olmalı. Bu, **H**'yi Z1'e koyar; Z1'deki pencere kapanır, **D** girişte, **B** koridorda bulunur. Bu, **F**'yi bulur.",
      "Z8 S7'de biri olmalı; bu ancak **G** olabilir. Bu, **H**'yi bulur ve makine dairesindeki halıyı da kapatır; bu **C**'yi S5'e koyar, bu da **B**'yi bulur.",
      "Bu, **A**'yı, sonra **C**'yi, sonra sandalyesiz son karede **E**'yi, sonra **O**'yu bulur. Katil Fred!"]
 },

  de:["Weil **E** allein im Badezimmer ist, kann **A** nur im Esszimmer sein. Die Frau auf dem Esszimmerteppich kann nur **F** sein. (**G** ist südlich von **C**, also kann sie nicht in Z1 sein.)",

  tr:["**E** banyoda yalnız olduğundan **A** ancak yemek odasında olabilir. Yemek odası halısındaki kadın ancak **F** olabilir. (**G**, **C**'nin güneyinde, o halde Z1'de olamaz.)",

      "Z8'de tek boş kare var; **E** orada olmalı.",

  de:["Laut dem allgemeinen Hinweis ist jemand auf dem Teppich in der Toilette. Schließe den Rest von S7 aus.",
      "**H** kann jetzt nur auf zwei Feldern sein. Schließe das sich überschneidende Feld bei Z6 S8 aus.",

      "Die verbleibenden Felder auf dem Lobby-Teppich sind alle in S5. Jemand ist auf dem Teppich, also schließe den Rest von S5 aus.",
      "Das lässt nur ein verfügbares Feld in der obersten Zeile, in S1. Es muss besetzt sein.",
      "Das lokalisiert **G** bei Z4 S2, also ist das besetzte Teppichfeld in der Toilette Z3 S7. Das muss **A** sein (der nördlich von **G** ist), da **F** nur in Z1 S1 sein kann, was **E** in Z2 S6 lokalisiert.",
      "Niemand kann in Z7 S4 sein, da dies alle Stühle für **D** blockieren würde. Das lässt nur ein Feld in S4, in der untersten Zeile, in dem **D** sein muss. Schließe die anderen Stühle aus.",
      "**B** ist in S3 der Lobby, neben dem Stuhl. Das lokalisiert **C** im letzten verbleibenden Feld in Z7, dann **O** (südlich von **C**), dann **B** und **H**. Harold ist der Mörder!"],
  tr:["Genel ipucuna göre tuvaletteki halıda biri var. S7'nin geri kalanını ele.",
      "**H** artık yalnızca iki karede olabilir. Z6 S8'deki kesişen kareyi ele.",
      "Bu, hediyelik eşya dükkânındaki halıda tek boş kare bırakır: Z5 S8. Bu kare dolu olmalı.",
      "Lobi halısındaki kalan karelerin hepsi S5'te. Halıda biri var, o halde S5'in geri kalanını ele.",
      "Bu, en üst satırda S1'de tek boş kare bırakır. Dolu olmalı.",
      "Bu, **G**'yi Z4 S2'de bulur; o halde tuvaletteki dolu halı karesi Z3 S7. Bu **A** olmalı (**G**'nin kuzeyinde), çünkü **F** yalnızca Z1 S1'de olabilir; bu da **E**'yi Z2 S6'da bulur.",
      "Z7 S4'te kimse olamaz, çünkü **D** için tüm sandalyeleri kapatırdı. Bu, S4'te en alt satırda tek kare bırakır; **D** orada olmalı. Diğer sandalyeleri ele.",
      "**B**, lobide S3'te, sandalyenin yanında. Bu, **C**'yi Z7'deki son boş karede, sonra **O**'yu (**C**'nin güneyinde), sonra **B**'yi ve **H**'yi bulur. Katil Harold!"]

      "**H**'nin olabileceği tek satır Z3; **A** da Z4'te oturuyor. **H** hangi odada olursa olsun galeride başka bir kadın oturmalı; bu ancak **B** olabilir, Z1'de.",

const pkey=()=>player.trim().toLowerCase().replace(/[.#$\[\]\/]/g,"_");

function caseColor(l){if(l.glow)return l.glow;const h=Math.round((l.no*137.508+(l.book.charCodeAt(1)||0)*40)%360);return `hsl(${h} 95% 66%)`;}
function renderHome(){
  const box=$("bookList");box.innerHTML="";
  $("searchIn").placeholder=tt("search");$("searchX").classList.toggle("hidden",!$("searchIn").value);
  BOOKS.forEach(bk=>{
    const q=($("searchIn").value||"").trim().toLocaleLowerCase("de");
    const norm=t=>t.toLocaleLowerCase("de");
    const hit=l=>!q||String(l.no)===q.replace(/^#/,"")||norm(l.title.de).includes(q)||norm(l.title.tr).includes(q)||norm(l.intro.de).includes(q)||norm(l.intro.tr).includes(q)||l.people.some(p=>norm(p.name).includes(q))||Object.values(l.roomNames).some(r=>norm(r.de).includes(q)||norm(r.tr).includes(q));
    const ls=LEVELS.filter(l=>l.book===bk.id&&hit(l)).sort((a,b)=>a.no-b.no);
    if(q&&!ls.length)return;
    const h=document.createElement("div");h.className="book";
    h.innerHTML=`${loc(bk)} <small>${loc(bk.sub)}</small><button class="rb">${tt("rules")}</button>`;
    h.querySelector(".rb").onclick=()=>showRules(bk);
    box.appendChild(h);
    if(!ls.length){const e=document.createElement("div");e.className="empty";e.textContent=tt("noCases");box.appendChild(e);return;}
    const g=document.createElement("div");g.className="cases";
    ls.forEach(l=>{const b=document.createElement("button");b.className="case"+(solved[l.id]?" done":"");b.style.setProperty("--cc",caseColor(l));
      b.innerHTML=`<span class="cn">${l.no}</span><span class="ct">${loc(l.title)}</span>${solved[l.id]?`<span class="ck">✓ ${fmt(solved[l.id].time)}</span>`:""}`;
      b.onclick=()=>openLevel(l.id);g.appendChild(b);});

}

function openLevel(id){
  L=LEVELS.find(l=>l.id===id); BK=BOOKS.find(b=>b.id===L.book);
  const s=JSON.parse(localStorage.getItem("mk_b_"+id)||"null");
  board=s?s.b:{pos:{},x:{},n:{}};board.n=board.n||{}; tAcc=s?s.t:0; accused=null;
  hist=[];sel=L.people.find(p=>!board.pos[p.id])?.id||null;tool="place";showErr=false;
  document.documentElement.style.setProperty("--case",caseColor(L));
  $("home").classList.add("hidden");$("game").classList.remove("hidden");$("backBtn").classList.remove("hidden");
  startTimer();renderGame();window.scrollTo(0,0);
}
 function siblings(){return LEVELS.filter(l=>l.book===L.book).sort((a,b)=>a.no-b.no);}
function goCase(d){const ls=siblings(),i=ls.findIndex(l=>l.id===L.id),t=ls[i+d];if(!t)return;saveBoard();stopTimer();openLevel(t.id);}
$("prevBtn").onclick=()=>goCase(-1);$("nextBtn").onclick=()=>goCase(1);
function closeLevel(){saveBoard();stopTimer();L=null;
  document.documentElement.style.setProperty("--case","#b69cff");

$("backBtn").onclick=closeLevel;
function saveBoard(){if(L)localStorage.setItem("mk_b_"+L.id,JSON.stringify({b:board,t:elapsed()}));}

function cellsOf(o){if(o.cells)return o.cells;const a=[];for(let i=0;i<(o.h||1);i++)for(let j=0;j<(o.w||1);j++)a.push([o.r+i,o.c+j]);return a;}
function objAt(r,c){return L.objects.find(o=>o.t!=="window"&&o.t!=="deco"&&cellsOf(o).some(([a,b])=>a===r&&b===c));}
function isBlocked(r,c){const o=objAt(r,c);return !!o&&(BK.noocc.includes(o.t)||(OBJ[o.t]&&OBJ[o.t].occ===false));}
function whoAt(r,c){return Object.keys(board.pos).find(k=>board.pos[k][0]===r&&board.pos[k][1]===c);}
function letter(p){return p.k||p.name[0];}

function renderGame(){
  $("brand").textContent=`${loc(BK)} · ${L.no}`;
  $("cTitle").textContent=`${L.no}. ${loc(L.title)}`;
  {const ls=siblings(),i=ls.findIndex(l=>l.id===L.id);$("prevBtn").disabled=i<=0;$("nextBtn").disabled=i>=ls.length-1;$("navNo").textContent=`${L.no} / ${ls.length}`;}

    d.onclick=()=>{sel=p.id;tool="place";renderGame();};

  drawBoard($("board"),Math.min(stableW()-28,532,Math.round((window.innerHeight||800)*.5)),false);
  $("toolPlace").classList.toggle("on",tool==="place");$("toolX").classList.toggle("on",tool==="x");
  $("howto").textContent=tool==="x"?"":tt("howto");

}

function drawBoard(B,W,sol,ro){
  const NR=L.rooms.length, NC=L.rooms[0].length, cb=20, lw=24, th=18;
  const cs=Math.floor(Math.min((W-2*cb-lw-10)/NC, NR>NC?(W*1.25)/NR:999)), bsW=cs*NC+10, bsH=cs*NR+10, W2=cb+lw+bsW+cb, H2=cb+th+bsH+cb;
  B.style.width=W2+"px";B.style.height=H2+"px";B.innerHTML="";
  const G=document.createElement("div");G.className="board";G.style.cssText=`left:${(W2-bsW-2*cb-lw)/2+cb+lw}px;top:${cb+th}px;width:${bsW}px;height:${bsH}px`;B.appendChild(G);
  const inner=document.createElement("div");inner.style.cssText=`position:absolute;left:0;top:0;width:${cs*NC}px;height:${cs*NR}px`;G.appendChild(inner);
  const lab=(cls,css,html)=>{const e=document.createElement("div");e.className=cls;e.style.cssText=css;e.innerHTML=html;B.appendChild(e);};
  const RL=lang==="tr"?"S":"Z", CL=lang==="tr"?"Sü":"S";
  for(let i=0;i<NR;i++)
    lab("axl",`left:${cb}px;top:${cb+th+5+i*cs}px;width:${lw}px;height:${cs}px;font-size:${Math.min(12,cs*.32)}px`,RL+(i+1));
  for(let i=0;i<NC;i++){
    lab("axl",`left:${cb+lw+5+i*cs}px;top:${cb}px;width:${cs}px;height:${th}px;font-size:${Math.min(12,cs*(CL.length>1?.26:.32))}px;white-space:nowrap`,CL+(i+1));
  }
  const cp=tt("compass"), lineH=w=>`<i style="width:${w}px;height:1.5px"></i>`, lineV=h=>`<i style="height:${h}px;width:1.5px"></i>`;
  const llH=bsW*0.3, llV=bsH*0.3;
  lab("cmp",`left:${cb+lw}px;top:0;width:${bsW}px;height:${cb}px`,lineH(llH)+cp[0]+lineH(llH));
  lab("cmp",`left:${cb+lw}px;top:${H2-cb}px;width:${bsW}px;height:${cb}px`,lineH(llH)+cp[2]+lineH(llH));
  lab("cmp",`left:0;top:${cb+th}px;width:${cb}px;height:${bsH}px;flex-direction:column`,lineV(llV)+cp[3]+lineV(llV));
  lab("cmp",`left:${W2-cb}px;top:${cb+th}px;width:${cb}px;height:${bsH}px;flex-direction:column`,lineV(llV)+cp[1]+lineV(llV));
  const add=(cls,css,html)=>{const e=document.createElement("div");e.className=cls;e.style.cssText=css;if(html)e.innerHTML=html;inner.appendChild(e);return e;};
  const P=sol?L.solution:board.pos;
  const rows={},cols={};Object.values(P).forEach(([r,c])=>{rows[r]=(rows[r]||0)+1;cols[c]=(cols[c]||0)+1;});
  const hasVoid=L.rooms.some(x=>x.includes("."));
  if(hasVoid){G.style.background="transparent";G.style.borderColor="transparent";G.style.boxShadow="none";}
  for(let r=0;r<NR;r++)for(let c=0;c<NC;c++){
    if(L.rooms[r][c]===".")continue;
    const rn=L.roomNames[L.rooms[r][c]],f=FLOORS[rn.floor]||FLOORS.plain;
    const e=add("cell",`left:${c*cs}px;top:${r*cs}px;width:${cs}px;height:${cs}px;${f(rn.a,rn.b)}`);
    if(!sol&&!ro)bindCell(e,r,c);
  }
  // Wände
  const wt=Math.max(4,Math.round(cs*.07));
  if(hasVoid){const ow=5,isV=(r,c)=>r<0||c<0||r>=NR||c>=NC||L.rooms[r][c]===".";
    inner.style.filter="drop-shadow(0 0 2px var(--case)) drop-shadow(0 0 12px var(--case))";
    for(let r=0;r<NR;r++)for(let c=0;c<NC;c++){if(isV(r,c))continue;
      const xl=isV(r,c-1)?ow:0,xr=isV(r,c+1)?ow:0,yt=isV(r-1,c)?ow:0,yb=isV(r+1,c)?ow:0;
      if(isV(r-1,c))add("wall",`left:${c*cs-xl}px;top:${r*cs-ow}px;width:${cs+xl+xr}px;height:${ow}px`);
      if(isV(r+1,c))add("wall",`left:${c*cs-xl}px;top:${(r+1)*cs}px;width:${cs+xl+xr}px;height:${ow}px`);
      if(isV(r,c-1))add("wall",`left:${c*cs-ow}px;top:${r*cs-yt}px;width:${ow}px;height:${cs+yt+yb}px`);
      if(isV(r,c+1))add("wall",`left:${(c+1)*cs}px;top:${r*cs-yt}px;width:${ow}px;height:${cs+yt+yb}px`);}}
  for(let r=0;r<NR;r++)for(let c=0;c<NC;c++){
    if(L.rooms[r][c]===".")continue;
    if(c<NC-1&&L.rooms[r][c+1]!=="."&&L.rooms[r][c]!==L.rooms[r][c+1])add("wall",`left:${(c+1)*cs-wt/2}px;top:${r*cs-wt/2}px;width:${wt}px;height:${cs+wt}px`);
    if(r<NR-1&&L.rooms[r+1][c]!=="."&&L.rooms[r][c]!==L.rooms[r+1][c])add("wall",`left:${c*cs-wt/2}px;top:${(r+1)*cs-wt/2}px;width:${cs+wt}px;height:${wt}px`);
  }
  // Objekte
  L.objects.forEach(o=>{
    if(o.t==="deco"){
      let sz=cs*(o.s||.5),x=o.c*cs+cs*(o.x!=null?o.x:.5)-sz/2,y=o.r*cs+cs*(o.y!=null?o.y:.42)-sz/2;
      // Auf Tischen: innerhalb der Tischplatte halten
      const tb=L.objects.find(t=>t.t==="table"&&(t.cells?t.cells.some(([r,c])=>r===o.r&&c===o.c):o.r>=t.r&&o.r<t.r+(t.h||1)&&o.c>=t.c&&o.c<t.c+(t.w||1)));
      if(tb){const has=(r,c)=>tb.cells?tb.cells.some(([a,b])=>a===r&&b===c):r>=tb.r&&r<tb.r+(tb.h||1)&&c>=tb.c&&c<tb.c+(tb.w||1);
        const x0=o.c*cs+(has(o.r,o.c-1)?0:cs*.1),x1=(o.c+1)*cs-(has(o.r,o.c+1)?0:cs*.1);
        const y0=o.r*cs+(has(o.r-1,o.c)?0:cs*.1),y1=(o.r+1)*cs-(has(o.r+1,o.c)?0:cs*.38);
        sz=Math.min(sz,cs*.5,(x1-x0)*.98,(y1-y0)*.98);
        const cx=Math.min(Math.max(x+ (cs*(o.s||.5))/2,x0+sz/2),x1-sz/2),cy=Math.min(Math.max(o.r*cs+cs*(o.y!=null?o.y:.42),y0+sz/2),y1-sz/2);
        x=cx-sz/2;y=cy-sz/2;}
      const e=add("ov",`left:${x}px;top:${y}px;width:${sz}px;height:${sz}px;z-index:4`,DECO[o.k]||"");
      e.firstChild?.setAttribute("style","width:100%;height:100%;display:block");return;
    }
    if(o.t==="window"){
      const horiz=o.side==="top"||o.side==="bottom", L1=cs*.66, T1=cs*.24;
      // Mittellinie der Wand: Außenrand = Mitte des 5px-Rahmens, innen = Wandlinie
      const edge=(o.side==="top"&&o.r===0)?-2.5:(o.side==="bottom"&&o.r===NR-1)?NR*cs+2.5:(o.side==="left"&&o.c===0)?-2.5:(o.side==="right"&&o.c===NC-1)?NC*cs+2.5:null;
      let x,y,w,h;
      if(horiz){w=L1;h=T1;x=o.c*cs+(cs-w)/2;const ly=edge!==null?edge:(o.side==="top"?o.r*cs:(o.r+1)*cs);y=ly-h/2;}
      else{w=T1;h=L1;y=o.r*cs+(cs-h)/2;const lx=edge!==null?edge:(o.side==="left"?o.c*cs:(o.c+1)*cs);x=lx-w/2;}
      add("win",`left:${x}px;top:${y}px;width:${w}px;height:${h}px`,WINDOW_SVG(horiz)).firstChild.setAttribute("style","width:100%;height:100%;display:block");return;
    }
    if(o.cells){
      const r0=Math.min(...o.cells.map(c=>c[0])),c0=Math.min(...o.cells.map(c=>c[1]));
      const w=Math.max(...o.cells.map(c=>c[1]))-c0+1,h=Math.max(...o.cells.map(c=>c[0]))-r0+1;
      add("ov",`left:${c0*cs}px;top:${r0*cs}px;width:${w*cs}px;height:${h*cs}px`,(o.t==="carpet"?polyCarpetSVG(o.cells,o.col):polyTableSVG(o.cells,o.col))).firstChild?.setAttribute("style","width:100%;height:100%;display:block");
      return;
    }
    const w=(o.w||1),h=(o.h||1);
    const multi=w>1||h>1;
    const html=o.t==="bed"?(o.col?bigBedSVG(w,h,o.col):bedSVG(w,h)):(o.t==="table"&&(multi||o.col))?tableSVG(w,h,o.col):(o.t==="carpet"&&(multi||o.col))?carpetSVG(w,h,o.col):o.t==="car"?SVG.car:o.t==="chair"?chairSVG(o.col):(o.t==="plant"&&o.col)?SVG.plant.replace(/#5fae4f/g,o.col).replace(/#2f5d2a/g,shade(o.col,-45)):SVG[o.t]||"";
    add("ov",`left:${o.c*cs}px;top:${o.r*cs}px;width:${w*cs}px;height:${h*cs}px`,html).firstChild?.setAttribute("style","width:100%;height:100%;display:block");
  });
  // Raumschilder (unten mittig im Raum)
  Object.keys(L.roomNames).forEach(k=>{
    let r0=99,r1=-1,c0=99,c1=-1;
    for(let r=0;r<NR;r++)for(let c=0;c<NC;c++)if(L.rooms[r][c]===k){r0=Math.min(r0,r);r1=Math.max(r1,r);c0=Math.min(c0,c);c1=Math.max(c1,c);}
    if(r1<0)return;
    const rn=L.roomNames[k], txt=loc(rn);

    if(L.roomNames[k].row!=null)r1=L.roomNames[k].row;
    let bc0=99,bc1=-1;for(let c=0;c<NC;c++)if(L.rooms[r1][c]===k){bc0=Math.min(bc0,c);bc1=Math.max(bc1,c);}
    // freien Platz in der untersten Zeile suchen (Felder ohne Objekt), längste Strecke, bei Gleichstand links
    let best=null,run=null;
    for(let c=bc0;c<=bc1+1;c++){
      const free=c<=bc1&&L.rooms[r1][c]===k&&!objAt(r1,c);
      if(free){if(!run)run=[c,c];else run[1]=c;}
      else if(run){if(!best||run[1]-run[0]>best[1]-best[0])best=run;run=null;}
    }
    const roomW=bc1-bc0+1;
    let lc,lw2;
    if(best&&(best[1]-best[0]+1)>=2){lw2=Math.min(roomW,best[1]-best[0]+2);lc=(best[0]+best[1]+1)/2;}
    else{lw2=roomW;lc=(bc0+bc1+1)/2;}
    let top=rn.top;
    if(rn.lab)lw2=rn.lab[2];
    if(top){ // Schild oben im Raum (wie im Buch)
      let tc0=99,tc1=-1;for(let c=0;c<NC;c++)if(L.rooms[r0][c]===k){tc0=Math.min(tc0,c);tc1=Math.max(tc1,c);}
      lc=(tc0+tc1+1)/2;lw2=tc1-tc0+1;
    }
    const fs=Math.max(6.5,Math.min(14,cs*.2,(lw2*cs*.94-20)/(txt.length*.68)));
    const estW=(txt.length*.68*fs+20)/cs;
    if(!top&&!rn.lab)lc=Math.max(bc0+estW/2,Math.min(bc1+1-estW/2,lc));
    lc=Math.max(estW/2+.05,Math.min(NC-estW/2-.05,lc));
    if(rn.lab){r1=rn.lab[0];lc=rn.lab[1];}
    const ty=top?r0*cs+fs*.5:(r1+1)*cs-fs*1.9;
    const e=add("rlab",`left:${lc*cs}px;top:${ty}px;font-size:${fs}px;padding:1px ${Math.max(4,fs*.6)}px`);e.textContent=txt;
  });
  // Markierungen
  if(sol){
    Object.entries(L.solution).forEach(([id,[r,c]])=>{
      const p=L.people.find(p=>p.id===id);
      add("mark",`left:${c*cs}px;top:${r*cs-cs*.08}px;width:${cs}px;height:${cs}px`,pawnSVG(p,id===L.murderer));
    });
    return;
  }
  // Markierungen
  for(let r=0;r<NR;r++)for(let c=0;c<NC;c++){
    if(L.rooms[r][c]===".")continue;
    const who=whoAt(r,c),css=`left:${c*cs}px;top:${r*cs}px;width:${cs}px;height:${cs}px`,key=r+","+c;
    if(who){
      const p=L.people.find(p=>p.id===who);
      const bad=(rows[r]>1||cols[c]>1)||(showErr&&(L.solution[who][0]!==r||L.solution[who][1]!==c));
      add("mark",css,`<div class="tok${p.victim?" vic":""}${bad?" bad":""}" style="font-size:${cs*.42}px">${letter(p)}</div>`);
    }else if(board.x[key]) add("mark",css,XSVG);
    else if((rows[r]||cols[c])&&!isBlocked(r,c)) add("mark auto",css,XSVG);
    else if(board.n[key]&&board.n[key].length){
      const pos=[["3%","3%"],["3%","59%"],["59%","3%"],["59%","59%"]];
      add("notes",css,board.n[key].slice(0,4).map((id,i)=>{const p=L.people.find(p=>p.id===id);
        return `<span class="${p.victim?"vic":""}" style="top:${pos[i][0]};left:${pos[i][1]};font-size:${cs*.22}px">${letter(p)}</span>`;}).join(""));
    }
  }
}
function infoDiagram(rows){
  const cs=26,R=rows.length,C=Math.max(...rows.map(r=>r.length)),pad=3;
  const ch=(r,c)=>(r<0||r>=R||c<0||c>=(rows[r]||"").length)?" ":rows[r][c];
  const reg=x=>x===" "?"x":(",V".includes(x)?"g":"w");
  let o="";
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){const x=ch(r,c);if(x===" ")continue;
    const X=pad+c*cs,Y=pad+r*cs;
    o+=`<rect x="${X}" y="${Y}" width="${cs}" height="${cs}" fill="${reg(x)==="g"?"#b9d99c":"#f4f1e6"}" stroke="#555" stroke-width="1"/>`;
    if("vV".includes(x))o+=`<path d="M${X+6} ${Y+13} L${X+11} ${Y+19} L${X+20} ${Y+7}" stroke="#3f8a3a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
    if(x==="x")o+=`<path d="M${X+7} ${Y+7} L${X+cs-7} ${Y+cs-7} M${X+cs-7} ${Y+7} L${X+7} ${Y+cs-7}" stroke="#1b1a20" stroke-width="4" stroke-linecap="round"/>`;
    if(x==="A")o+=`<rect x="${X+3}" y="${Y+2}" width="${cs-6}" height="${cs-4}" rx="3" fill="#efe3c4" stroke="#555" stroke-width="1"/><text x="${X+cs/2}" y="${Y+cs*.72}" font-size="17" font-weight="700" text-anchor="middle" font-family="Kalam,cursive" fill="#1b1a20">A</text>`;
    if(x==="a")o+=`<text x="${X+cs/2}" y="${Y+cs*.72}" font-size="19" font-weight="700" text-anchor="middle" font-family="Zilla Slab,Georgia,serif" fill="#1b1a20">a</text>`;
  }
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){const x=ch(r,c);if(x===" ")continue;const X=pad+c*cs,Y=pad+r*cs,me=reg(x);
    if(reg(ch(r-1,c))!==me)o+=`<line x1="${X}" y1="${Y}" x2="${X+cs}" y2="${Y}" stroke="#1b1a20" stroke-width="3.5" stroke-linecap="square"/>`;
    if(reg(ch(r+1,c))!==me)o+=`<line x1="${X}" y1="${Y+cs}" x2="${X+cs}" y2="${Y+cs}" stroke="#1b1a20" stroke-width="3.5" stroke-linecap="square"/>`;
    if(reg(ch(r,c-1))!==me)o+=`<line x1="${X}" y1="${Y}" x2="${X}" y2="${Y+cs}" stroke="#1b1a20" stroke-width="3.5" stroke-linecap="square"/>`;
    if(reg(ch(r,c+1))!==me)o+=`<line x1="${X+cs}" y1="${Y}" x2="${X+cs}" y2="${Y+cs}" stroke="#1b1a20" stroke-width="3.5" stroke-linecap="square"/>`;
  }
  return `<svg width="${C*cs+pad*2}" height="${R*cs+pad*2}" viewBox="0 0 ${C*cs+pad*2} ${R*cs+pad*2}">${o}</svg>`;
}
function renderInfos(){
  const box=$("infos");box.innerHTML="";
  (L.info||[]).forEach(i=>{const d=document.createElement("div");d.className="info";
    const pic=i.icons?`<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">${i.icons.map(k=>`<div><div style="font-weight:700;font-size:16px">${loc(OBJ[k])}</div><div style="width:58px;height:58px;margin:0 auto">${SVG[k].replace("<svg",'<svg style="width:100%;height:100%"')}</div></div>`).join("")}</div>`:i.icon?`<div style="width:64px;height:64px;margin:0 auto">${SVG[i.icon].replace("<svg",'<svg style="width:100%;height:100%"')}</div>`:i.grid?infoDiagram(i.grid):"";
    d.innerHTML=`${i.title?`<b>${loc(i.title)}</b>`:""}${(i.icon||i.icons)?pic+`<span>${loc(i.text)}</span>`:(loc(i.text)?`<span>${loc(i.text)}</span>`:"")+pic}`;box.appendChild(d);});
}
function openZoom(){
  lockScroll(true);
  const ov=document.createElement("div");ov.id="zoomOv";
  ov.innerHTML=`<div class="zbar"><span>${tt("zoomHint")}</span><button id="zOut">−</button><button id="zIn">+</button><button id="zFit">⤢</button><button id="zClose">✕</button></div><div class="zarea" id="zArea"><div class="zin bwrap" id="zIn2"></div></div>`;
  document.body.appendChild(ov);
  const area=$("zArea"),zin=$("zIn2");
  drawBoard(zin,Math.min(stableW()-28,532),false,true);
  const bw=zin.offsetWidth,bh=zin.offsetHeight;
  let st={s:1,x:0,y:0},fitS=1;
  const apply=()=>{zin.style.transform=`translate(${st.x}px,${st.y}px) scale(${st.s})`;};
  const clamp=()=>{st.s=Math.max(fitS*.8,Math.min(fitS*6,st.s));
    const W=bw*st.s,H=bh*st.s,aw=area.clientWidth,ah=area.clientHeight;
    st.x=W<aw?(aw-W)/2:Math.min(0,Math.max(aw-W,st.x));st.y=H<ah?(ah-H)/2:Math.min(0,Math.max(ah-H,st.y));};
  const fit=()=>{fitS=Math.min(area.clientWidth/bw,area.clientHeight/bh)*.96;st.s=fitS;clamp();apply();};
  const zoomAt=(f,cx,cy)=>{const ns=Math.max(fitS*.8,Math.min(fitS*6,st.s*f));st.x=cx-(cx-st.x)*ns/st.s;st.y=cy-(cy-st.y)*ns/st.s;st.s=ns;clamp();apply();};
  fit();
  const pts=new Map();let last=null;
  const info=()=>{const a=[...pts.values()],r=area.getBoundingClientRect();
    if(a.length>=2)return{d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),cx:(a[0].x+a[1].x)/2-r.left,cy:(a[0].y+a[1].y)/2-r.top};
    return{d:0,cx:a[0].x-r.left,cy:a[0].y-r.top};};
  area.addEventListener("pointerdown",e=>{area.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});last=info();});
  area.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const n=info();if(last){if(pts.size>=2&&last.d&&n.d){zoomAt(n.d/last.d,n.cx,n.cy);}st.x+=n.cx-last.cx;st.y+=n.cy-last.cy;clamp();apply();}last=n;});
  const up=e=>{pts.delete(e.pointerId);last=pts.size?info():null;};
  area.addEventListener("pointerup",up);area.addEventListener("pointercancel",up);
  area.addEventListener("wheel",e=>{e.preventDefault();const r=area.getBoundingClientRect();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX-r.left,e.clientY-r.top);},{passive:false});
  const mid=()=>[area.clientWidth/2,area.clientHeight/2];
  $("zIn").onclick=()=>zoomAt(1.4,...mid());$("zOut").onclick=()=>zoomAt(1/1.4,...mid());$("zFit").onclick=fit;
  $("zClose").onclick=()=>{ov.remove();lockScroll(false);};
}
$("zoomBtn").onclick=openZoom;
function snap(){hist.push(JSON.stringify(board));if(hist.length>300)hist.shift();}
function lineBlocked(r,c){return Object.values(board.pos).some(([a,b])=>a===r||b===c);}
function tap(r,c){ // kurzer Tipp
  const who=whoAt(r,c),key=r+","+c;
  if(tool==="x"){if(who)return;snap();board.x[key]?delete board.x[key]:board.x[key]=1;}
  else{
    if(who){toast(tt("howto"));return;}
    if(!sel){toast(tt("pickFirst"));return;}
    if(isBlocked(r,c)){toast(tt("cantSit"));return;}
    if(lineBlocked(r,c)){toast(tt("xBlocked"));return;}
    const a=board.n[key]||[];
    snap();
    if(a.includes(sel))board.n[key]=a.filter(x=>x!==sel);
    else{if(a.length>=4){hist.pop();toast(tt("maxNotes"));return;}board.n[key]=[...a,sel];delete board.x[key];}
    if(!board.n[key].length)delete board.n[key];
  }
  showErr=false;accused=null;saveBoard();renderGame();
}
function placeSure(id,r,c){ // sicher setzen
  board.pos[id]=[r,c];
  const key=r+","+c;delete board.x[key];delete board.n[key];
  for(const k of Object.keys(board.n)){ // Vermutungen dieser Person + in Zeile/Spalte löschen
    const [a,b]=k.split(",").map(Number);
    board.n[k]=board.n[k].filter(x=>x!==id);
    if(a===r||b===c||!board.n[k].length)delete board.n[k];
  }
}
function hold(r,c){ // gedrückt halten
  if(tool==="x")return;
  const who=whoAt(r,c);
  if(who){snap();delete board.pos[who];sel=who;}
  else{
    if(!sel){toast(tt("pickFirst"));return;}
    if(isBlocked(r,c)){toast(tt("cantSit"));return;}
    snap();if(board.pos[sel])delete board.pos[sel];
    placeSure(sel,r,c);
    sel=L.people.find(p=>!board.pos[p.id])?.id||null;
  }
  if(navigator.vibrate)navigator.vibrate(30);
  showErr=false;accused=null;saveBoard();renderGame();
}
let _tapCell=null,_tapTimer=null;
function tapOrDouble(r,c){ // 1x tippen = Vermutung, 2x tippen = ✕
  const k=r+","+c;
  if(_tapTimer&&_tapCell===k){clearTimeout(_tapTimer);_tapTimer=null;_tapCell=null;toggleX(r,c);return;}
  if(_tapTimer){clearTimeout(_tapTimer);const [pr,pc]=_tapCell.split(",").map(Number);_tapTimer=null;tap(pr,pc);}
  _tapCell=k;_tapTimer=setTimeout(()=>{_tapTimer=null;_tapCell=null;tap(r,c);},260);
}
function toggleX(r,c){
  if(whoAt(r,c))return;
  const key=r+","+c;snap();
  if(board.x[key])delete board.x[key];else{board.x[key]=1;delete board.n[key];}
  if(navigator.vibrate)navigator.vibrate(15);
  showErr=false;accused=null;saveBoard();renderGame();
}
function bindCell(e,r,c){
  let t=null,fired=false,sx=0,sy=0;
  e.addEventListener("pointerdown",ev=>{fired=false;sx=ev.clientX;sy=ev.clientY;clearTimeout(t);t=setTimeout(()=>{fired=true;t=null;hold(r,c);},450);});
  e.addEventListener("pointermove",ev=>{if(t&&(Math.abs(ev.clientX-sx)>10||Math.abs(ev.clientY-sy)>10)){clearTimeout(t);t=null;fired=true;}});
  e.addEventListener("pointerup",ev=>{if(t){clearTimeout(t);t=null;if(!fired)tapOrDouble(r,c);}});
  e.addEventListener("pointercancel",()=>{clearTimeout(t);t=null;});
  e.addEventListener("contextmenu",ev=>ev.preventDefault());
}
$("toolPlace").onclick=()=>{tool="place";renderGame();};
$("toolX").onclick=()=>{tool="x";renderGame();};
$("rulesBtn").onclick=()=>showRules(BK);
$("undoBtn").onclick=()=>{if(!hist.length)return;board=JSON.parse(hist.pop());saveBoard();renderGame();};
$("resetBtn").onclick=()=>modal(`<h2>${tt("resetQ")}</h2><button class="btn" id="mY">${tt("yes")}</button><button class="btn sec" id="mN">${tt("no")}</button>`,
  ()=>{$("mY").onclick=()=>{board={pos:{},x:{},n:{}};hist=[];tAcc=0;accused=null;sel=L.people[0].id;startTimer();hideModal();saveBoard();renderGame();};$("mN").onclick=hideModal;});
$("hintBtn").onclick=()=>modal(`<h2>${tt("hintQ")}</h2><p>${tt("hintQTxt")}</p><button class="btn" id="mY">${tt("yes")}</button><button class="btn sec" id="mN">${tt("no")}</button>`,
  ()=>{$("mY").onclick=()=>{hideModal();doHint();};$("mN").onclick=hideModal;});
function doHint(){
  const wrong=Object.keys(board.pos).find(k=>board.pos[k][0]!==L.solution[k][0]||board.pos[k][1]!==L.solution[k][1]);
  snap();
  if(wrong){delete board.pos[wrong];toast(tt("hintFix")(L.people.find(p=>p.id===wrong).name));}
  else{
    const order=L.hintOrder||L.people.map(p=>p.id);
    const id=order.find(id=>!board.pos[id]);if(!id){hist.pop();return;}
    placeSure(id,...L.solution[id]);
    sel=L.people.find(p=>!board.pos[p.id])?.id||null;
    saveBoard();renderGame();
    const i=order.indexOf(id), si=[].concat(L.hintSteps?L.hintSteps[i]:i), stA=L.steps&&L.steps[lang]||[];
    const st=si.filter(k=>stA[k]).map(k=>`<p style="color:var(--ink);font-size:16px;text-align:left"><b>${k+1}.</b> ${bold(stA[k])}</p>`).join("");
    if(st)modal(`<h2>${tt("stepT")} ${si.map(k=>k+1).join(" + ")}</h2>${st}<button class="btn" id="mN">OK</button>`,()=>$("mN").onclick=hideModal);
    else toast(tt("hintSet")(L.people.find(p=>p.id===id).name));
    return;
  }
  saveBoard();renderGame();
}
$("solBtn").onclick=()=>modal(`<h2>${tt("solQ")}</h2><p>${tt("solQTxt")}</p><button class="btn" id="mY">${tt("yes")}</button><button class="btn sec" id="mN">${tt("no")}</button>`,
  ()=>{$("mY").onclick=showSolution;$("mN").onclick=hideModal;});
function showSolution(){
  const st=(L.steps&&L.steps[lang])||[];
  const m=L.people.find(p=>p.id===L.murderer);
  modal(`<h2>${loc(L.title)}</h2>
   <div class="verdict" style="margin:0 auto 14px;cursor:default"><div class="l">${tt("verdict")}</div><div class="v">${m.name}</div></div>
   <div class="bwrap" id="solBoard" style="margin:0 auto 12px"></div>
   <ol style="text-align:left;padding-left:22px;line-height:1.5;font-size:15px;margin:0 0 12px">${st.map(x=>`<li style="margin-bottom:6px">${bold(x)}</li>`).join("")}</ol>
   <button class="btn" id="mN">${tt("close")}</button>`,
   ()=>{$("mN").onclick=hideModal;const bx=$("mbox");drawBoard($("solBoard"),Math.min(bx.clientWidth-44,500),true);},"wide");
}
function gridOk(){return L.people.every(p=>board.pos[p.id]&&board.pos[p.id][0]===L.solution[p.id][0]&&board.pos[p.id][1]===L.solution[p.id][1]);}
function check(){
  if(Object.keys(board.pos).length<L.people.length){toast(tt("notFull"));return;}
  if(!gridOk()){modal(`<h2>${tt("wrong")}</h2><p>${tt("wrongTxt")}</p><button class="btn" id="mE">${tt("showErr")}</button><button class="btn sec" id="mN">${tt("close")}</button>`,
    ()=>{$("mE").onclick=()=>{showErr=true;hideModal();renderGame();};$("mN").onclick=hideModal;});return;}
  const sus=L.people.filter(p=>!p.victim);
  modal(`<h2>${tt("who")}</h2><p>${tt("whoTxt")}</p><div class="choices">${sus.map(p=>`<button data-p="${p.id}">${avatar(p)}${p.name}</button>`).join("")}</div>`,
    ()=>document.querySelectorAll(".choices button").forEach(b=>b.onclick=()=>accuse(b.dataset.p)));
}
$("checkBtn").onclick=check;$("verdict").onclick=check;
function accuse(id){
  if(id===L.murderer){
    accused=id;stopTimer();const t=elapsed(),p=L.people.find(p=>p.id===id);
    const prev=solved[L.id];if(!prev||t<prev.time){solved[L.id]={time:t,date:new Date().toISOString().slice(0,10)};pushSolved(L.id);}
    renderGame();
    modal(`<h2>${tt("right")}</h2><p>${tt("rightTxt")(p.name,fmt(t))}</p><button class="btn" id="mB">${tt("back")}</button><button class="btn sec" id="mN">${tt("close")}</button>`,
      ()=>{$("mB").onclick=()=>{hideModal();closeLevel();};$("mN").onclick=hideModal;});
  }else modal(`<h2>${tt("wrongM")}</h2><p>${tt("wrongMTxt")}</p><button class="btn sec" id="mN">${tt("close")}</button>`,()=>$("mN").onclick=hideModal);
}

/* ============ HELFER ============ */
 let _sy=0,_locked=false;
function lockScroll(on){
  if(on&&!_locked){_sy=window.scrollY;document.body.style.cssText+=`;position:fixed;top:-${_sy}px;left:0;right:0;overflow:hidden`;_locked=true;}
  else if(!on&&_locked){document.body.style.position="";document.body.style.top="";document.body.style.left="";document.body.style.right="";document.body.style.overflow="";window.scrollTo(0,_sy);_locked=false;}
}
function modal(html,bind,cls){lockScroll(true);$("mbox").className="box"+(cls?" "+cls:"");$("mbox").innerHTML=html;$("modal").classList.remove("hidden");bind&&bind();}
function hideModal(){lockScroll(false);$("modal").classList.add("hidden");}
$("modal").onclick=e=>{if(e.target.id==="modal")hideModal();};
let toastT;function toast(m){let d=document.querySelector(".toast");if(!d){d=document.createElement("div");d.className="toast";document.body.appendChild(d);}d.textContent=m;clearTimeout(toastT);toastT=setTimeout(()=>d.remove(),2000);}
function elapsed(){return tAcc+(tStart?Math.floor((Date.now()-tStart)/1000):0);}
function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function startTimer(){stopTimer();tStart=Date.now();tInt=setInterval(()=>$("timer").textContent=fmt(elapsed()),1000);$("timer").textContent=fmt(elapsed());}
function stopTimer(){if(tStart){tAcc=elapsed();tStart=0;}clearInterval(tInt);}
document.addEventListener("visibilitychange",()=>{if(!L||accused)return;if(document.hidden){stopTimer();saveBoard();}else startTimer();});
function stableW(){return Math.min(document.documentElement.clientWidth||screen.width,screen.width||9999);}
let _lastW=stableW();
window.addEventListener("resize",()=>{const w=stableW();if(Math.abs(w-_lastW)<2)return;_lastW=w;if(L)renderGame();});
// Doppeltipp-Zoom verhindern: der 2. Tipp startet schon im touchstart gesperrt (iOS)
let _lastEnd=0;
document.addEventListener("touchstart",e=>{
  if(e.touches.length===1&&Date.now()-_lastEnd<400&&!e.target.closest("input,textarea"))e.preventDefault();
},{passive:false});
document.addEventListener("touchend",e=>{if(!e.touches.length)_lastEnd=Date.now();},{passive:true});
// (alt) Doppeltipp-Zoom verhindern (Pinch-Zoom bleibt erlaubt)
let _lastTap=0;
document.addEventListener("touchend",e=>{
  if(e.touches&&e.touches.length)return;
  const t=Date.now();
  if(t-_lastTap<350&&!e.target.closest("input,textarea")){
    e.preventDefault();
    const b=e.target.closest("button");if(b)b.click();
  }
  _lastTap=t;
},{passive:false});
window.addEventListener("orientationchange",()=>setTimeout(()=>{_lastW=stableW();if(L)renderGame();},300));
